# Local development against the Azure Storage emulator (docker compose up azurite), so the Blob
# implementation can be exercised without an Azure subscription. Keys still come from the local
# provider - Key Vault has no emulator.
#
# The connection string below is Azurite's published, fixed development credential. It is in every
# Microsoft sample verbatim and grants access to nothing but a container on your own machine.
app.documents.storage=azure-blob
app.documents.blob.connection-string=${AZURITE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
app.documents.blob.container=report-documents
app.documents.blob.create-container-if-missing=true
