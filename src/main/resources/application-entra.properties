# Entra External ID client registration. Activated by adding the 'entra' profile to
# SPRING_PROFILES_ACTIVE (the permitted values are the ones enforced by deploy.yml step 5.1 - see
# there, not a copy here that could drift) - adding the profile is the whole switch, because it turns
# on the flag and supplies the registration in one step. Until then none of this is read and no OIDC
# bean exists.
#
# Nothing here is a secret. The client id and tenant/issuer are non-secret configuration the human
# records when they create the app registration (ENTRA-AUTH-DESIGN.md §7(b) items 2-4). The client
# secret is a Key Vault reference resolved by App Service, never a value in this file, and its
# target state is no secret at all - a federated credential against the managed identity, once the
# flow is proven (§4).
app.auth.entra.enabled=true

spring.security.oauth2.client.registration.entra.client-id=${ENTRA_CLIENT_ID}
# No fallback, deliberately, exactly as spring.datasource.password has none: a deployment that
# activates this profile without injecting the secret must fail to start rather than come up with a
# half-configured front door.
spring.security.oauth2.client.registration.entra.client-secret=${ENTRA_CLIENT_SECRET}
spring.security.oauth2.client.registration.entra.client-name=Sign in with Entra
spring.security.oauth2.client.registration.entra.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.entra.client-authentication-method=client_secret_basic
# {baseUrl} resolves per host, so the same build works behind the App Service default hostname and
# the custom domain when WS-I lands. The literal shape the human must register in the portal is
# https://<app-host>/login/oauth2/code/entra - register the custom domain one BEFORE cutover, since
# discovering a missing redirect URI during cutover is an avoidable outage (§7(b) item 3).
spring.security.oauth2.client.registration.entra.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# The three thin claims the design commits to: oid (the only thing we ever link on - the directory
# object id an ORG_ADMIN records at account creation; sub is pairwise per application and cannot be
# looked up in the portal, see EntraOidcUserService.objectIdOf), email (display only - D4 withdrew
# the one-time link ceremony this comment used to describe) and name (display). Nothing about
# organisations, roles, homes or export capability comes from the directory - that all stays in our
# database (§3).
spring.security.oauth2.client.registration.entra.scope=openid,profile,email

# Post-logout: the shape the human registers must match what we send. {baseUrl} for the same reason
# as redirect-uri above - the custom domain (WS-I) would otherwise leave sign-IN working and
# sign-OUT silently failing to match. The literal to register today is
# https://<app-host>/login?logout, and the custom-domain equivalent wants adding at the same time as
# the redirect URI, not later.

# OIDC discovery, so the authorization/token/JWKS endpoints and the issuer check come from the
# tenant's own metadata rather than being hand-copied into config.
spring.security.oauth2.client.provider.entra.issuer-uri=${ENTRA_ISSUER_URI}
