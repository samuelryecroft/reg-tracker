spring.application.name=return-home-tracker

# Credentials come from the environment, never from this file. On Azure App Service these are
# injected as Key Vault references (see ARCHITECTURE.md); locally, export them in your shell or
# use an untracked application-local.properties. The non-secret local-dev fallbacks below are for
# a throwaway container only and must not be reused for any real database; no password of any kind
# has a default here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/return_home_tracker}
spring.datasource.username=${DB_USERNAME:tracker}
# No fallback on purpose: a deployment that forgets to inject DB_PASSWORD must fail to start
# rather than quietly come up on a well-known default credential. Local development gets the
# throwaway-container password from application-dev.properties (SPRING_PROFILES_ACTIVE=dev).
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.docx.template-path=classpath:docx-templates/rhi-report-template.docx

# Bootstrap admin. There is deliberately NO default password: if ADMIN_SEED_PASSWORD is unset the
# seeder skips and logs a warning rather than creating a well-known account (see AdminUserSeeder).
app.admin.username=${ADMIN_SEED_USERNAME:admin}
app.admin.password=${ADMIN_SEED_PASSWORD:}

# Failed-login throttling. Lockout is per-username and in-memory, which suits the single-instance
# App Service deployment in ARCHITECTURE.md; it resets on restart and would need a shared store if
# the app is ever scaled out.
app.security.login-throttle.enabled=true
app.security.login-throttle.max-attempts=5
app.security.login-throttle.lockout-duration=15m

# WS-C observability (M4 go-live gate). Actuator exposes health + info only; everything else
# stays off the web surface. App Service liveness/readiness probes hit the health groups below.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# Probes reflect the app's own lifecycle state, NOT downstream dependencies. Readiness deliberately
# does NOT gate on db/blob/keyvault: a slow or not-yet-provisioned dependency must not make App
# Service pull the instance out of rotation. Dependency health still shows in the full /actuator/health
# (drives alerting) - it just doesn't fail the probe. This is what keeps pre-provisioning boots green.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState
# Anonymous probes see status only ({"status":"UP"}); component/detail breakdown needs an authenticated ADMIN.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Return Home interview tracker

# FE-11 prerequisite: content-hash the /static assets so app.css / role-constraints.js
# get a far-future Cache-Control instead of being re-fetched on every navigation.
# Thymeleaf's @{...} link expressions resolve to the fingerprinted URL automatically.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d

# Report documents (WS-B; DOCUMENT-ENCRYPTION-DESIGN.md §4). Generated .docx files are envelope-
# encrypted in the application before they reach storage - there is deliberately no setting that
# turns that off, only settings that choose where the ciphertext lives and who holds the keys.
# These are the development values: ciphertext on the local filesystem, per-organisation KEKs
# derived in-process. Deployment activates the `azure` profile instead, and DocumentStorageConfig
# refuses to start a production environment on either local backend.
app.documents.storage=local
app.documents.keys=local
# Where the ciphertext lands locally. This replaced app.docx.output-dir, which named a plaintext
# .docx output directory that no longer exists - the store owns persistence now, and what is written
# here is encrypted.
app.documents.local.directory=${user.dir}/generated-reports
# NOT a secret, and not a credential to anything: it is the KDF input for the local development key
# provider, which protects nothing real because its derived keys live in the same process as the
# ciphertext. It cannot be used in production - the config guard rejects it there - so a leaked
# value gives an attacker nothing. Override it with DOCUMENT_KEY_SECRET to keep local documents
# readable across a machine rebuild.
app.documents.local-keys.master-secret=${DOCUMENT_KEY_SECRET:local-development-only-not-a-secret}
