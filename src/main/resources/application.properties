spring.application.name=return-home-tracker

spring.datasource.url=jdbc:postgresql://localhost:5432/return_home_tracker
spring.datasource.username=tracker
spring.datasource.password=tracker

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.docx.template-path=classpath:docx-templates/rhi-report-template.docx
app.docx.output-dir=${user.dir}/generated-reports

app.admin.username=admin
app.admin.password=ChangeMe123!

# FE-11 prerequisite: content-hash the /static assets so app.css / role-constraints.js
# get a far-future Cache-Control instead of being re-fetched on every navigation.
# Thymeleaf's @{...} link expressions resolve to the fingerprinted URL automatically.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
