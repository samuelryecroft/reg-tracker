spring.application.name=return-home-tracker

# Credentials come from the environment, never from this file. On Azure App Service these are
# injected as Key Vault references (see ARCHITECTURE.md); locally, export them in your shell or
# use an untracked application-local.properties. The non-secret local-dev fallbacks below are for
# a throwaway container only and must not be reused for any real database; no password of any kind
# has a default here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/return_home_tracker}
spring.datasource.username=${DB_USERNAME:tracker}
# No fallback on purpose: a deployment that forgets to inject DB_PASSWORD must fail to start
# rather than quietly come up on a well-known default credential. Local development gets the
# throwaway-container password from application-dev.properties (SPRING_PROFILES_ACTIVE=dev).
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.docx.template-path=classpath:docx-templates/rhi-report-template.docx
app.docx.output-dir=${user.dir}/generated-reports

# Bootstrap admin. There is deliberately NO default password: if ADMIN_SEED_PASSWORD is unset the
# seeder skips and logs a warning rather than creating a well-known account (see AdminUserSeeder).
app.admin.username=${ADMIN_SEED_USERNAME:admin}
app.admin.password=${ADMIN_SEED_PASSWORD:}

# Failed-login throttling. Lockout is per-username and in-memory, which suits the single-instance
# App Service deployment in ARCHITECTURE.md; it resets on restart and would need a shared store if
# the app is ever scaled out.
app.security.login-throttle.enabled=true
app.security.login-throttle.max-attempts=5
app.security.login-throttle.lockout-duration=15m

# FE-11 prerequisite: content-hash the /static assets so app.css / role-constraints.js
# get a far-future Cache-Control instead of being re-fetched on every navigation.
# Thymeleaf's @{...} link expressions resolve to the fingerprinted URL automatically.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d
