<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<!--
  T38 / audit-mockups.html §01. One component, used on the interview request/report page, the
  child page (as a "Case history" grouped by request) and the admin user-edit page. `sections` is a
  List<AuditHistorySection> - AuditHistoryService is the only place that builds one, and it is what
  keeps this fragment GDPR-safe: every field it renders (headline/when/actorRole/detail) was already
  curated from an explicit allow-list before it got here, so there is nothing left for this markup
  to accidentally leak.

  Semantic <ol> of events, day- or request-separated by a heading - no expand, no hover-reveal, no
  affordance suggesting hidden content (Creed's note: the rows carry identifiers and status
  transitions only, and the UI must not imply a diff exists behind them). That is also what makes it
  printable without a redesign once feature 2.5's export reuses it.
-->
<th:block th:fragment="provenance">
    <div class="provenance">
        <span aria-hidden="true">🗄</span>
        <span>This record is permanent and cannot be edited or deleted.</span>
    </div>
</th:block>

<th:block th:fragment="timeline(sections)">
    <div class="empty" th:if="${#lists.isEmpty(sections)}">
        <div class="big">No recorded activity.</div>
    </div>
    <th:block th:each="section : ${sections}">
        <p class="daysep" th:text="${section.label()}">Section</p>
        <ol class="tl">
            <li th:each="entry : ${section.entries()}">
                <span class="dot" th:classappend="${entry.tone()}"></span>
                <div class="ev">
                    <span class="what" th:text="${entry.headline()}">What happened</span>
                    <span class="when" th:text="${entry.when()}">When</span>
                </div>
                <p class="who" th:if="${entry.actorRole() != null}">
                    <span class="role" th:text="'(' + ${entry.actorRole()} + ')'">(Role)</span>
                </p>
                <span class="detail" th:if="${entry.detail() != null}" th:text="${entry.detail()}">Detail</span>
            </li>
        </ol>
    </th:block>
</th:block>
</body>
</html>
