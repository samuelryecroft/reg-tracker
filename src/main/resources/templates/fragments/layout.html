<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<th:block th:fragment="styles">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/app.css}">
<style th:if="${theme != null}"
       th:text="${':root { --accent: ' + theme.primaryColor + '; --accent-dark: ' + theme.primaryColorDark + '; --accent-ink: ' + theme.primaryColorInk + '; --tint: ' + theme.secondaryColor + '; }'}"></style>
</th:block>

<!-- FE-02: shared field-error rendering. Pairs with th:errorclass="is-invalid" and aria-describedby
     on the input; the ▲ glyph and colour come from .field-error in app.css, not from this markup,
     so validation is never signalled by colour alone. -->
<th:block th:fragment="fieldError(field)">
    <p class="field-error" th:if="${#fields.hasErrors(field)}" th:id="${field} + '-error'" th:errors="${field}"></p>
</th:block>
</head>
<body>
<th:block th:fragment="nav">
<a class="skip-link" href="#main">Skip to main content</a>
<header>
    <nav aria-label="Main">
        <a class="brand" href="/"><span class="brand-mark"></span>Return Home Tracker</a>
        <a th:if="${#authorization.expression('hasRole(''HOME_STAFF'')')}" href="/requests">My Requests</a>
        <a th:if="${#authorization.expression('hasRole(''HOME_STAFF'')')}" href="/children">My Children</a>
        <a th:if="${#authorization.expression('hasRole(''COORDINATOR'')')}" href="/coordinator/requests">All Requests</a>
        <a th:if="${#authorization.expression('hasRole(''VISITOR'')')}" href="/visitor/interviews">My Interviews</a>
        <a th:if="${#authorization.expression('hasRole(''REVIEWER'')')}" href="/reviewer/reports">Review Queue</a>
        <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ORG_ADMIN'')')}" href="/admin/users">Users</a>
        <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ORG_ADMIN'')')}" href="/admin/homes">Homes</a>
        <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ORG_ADMIN'',''VIEWER'')')}" href="/children">Children</a>
        <a th:if="${canEditTheme}" href="/admin/theme">Branding</a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/admin/organisations">Organisations</a>
    </nav>
    <form method="post" th:action="@{/logout}">
        <span sec:authentication="name" class="header-user"></span>
        <button type="submit">Log out</button>
    </form>
</header>
</th:block>
</body>
</html>
