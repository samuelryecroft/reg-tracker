<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<th:block th:fragment="styles">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" th:href="@{/css/app.css}">
<style th:if="${theme != null}"
       th:text="${':root { --accent: ' + theme.primaryColor + '; --accent-dark: ' + theme.primaryColorDark + '; --accent-ink: ' + theme.primaryColorInk + '; --tint: ' + theme.secondaryColor + '; }'}"></style>
<!-- T138 (phase 2, batch 1a): overrides app.css's hardcoded default hue (289) with the signed-in
     user's actual effective supplier theme, derived by ThemeService.brandHueOf from the same
     primaryColor hex the legacy override above already reads - one shared derivation point, so this
     and the docx report's own hue ramp (T137) can never silently disagree for the same supplier. -->
<style th:if="${theme != null}" th:text="${':root { --brand-hue: ' + theme.brandHue + '; }'}"></style>
</th:block>
</head>
<body>
<!-- FE-02: shared field-error rendering. Pairs with th:errorclass="is-invalid" and aria-describedby
     on the input, so validation is never signalled by colour alone.

     T165 - THIS FRAGMENT LIVED IN <head> AND RENDERED NOTHING. The parser auto-closes <head> at the
     first non-metadata element, which pushed the <p> out of the th:fragment block: the fragment
     resolved, its bare text rendered, and its only ELEMENT silently vanished. So every inline
     validation message on every form was missing, and every input's aria-describedby pointed at an
     id that was never emitted - a dangling reference announces nothing. Nothing caught it: the
     status is 200, the model still carries the errors, the error summary at the top of each form
     still renders (a different template, in <body>), and no test asserted the rendered message.
     Fragments that emit elements belong in <body>. Pinned by
     DirectoryObjectIdFormIntegrationTest#anInlineValidationMessageStillRendersAndIsNotPrefixedByACharacterName.

     The marker used to be .field-error::before { content: "U+25B2" } in app.css. CSS generated
     content IS exposed to the accessibility tree by the major screen readers, so once this fragment
     renders it would have prefixed every message with a character name before the sentence that
     says what is wrong. It is aria-hidden markup instead. th:errors moves to the inner <span>
     because it REPLACES the element's content: left on the <p> it would overwrite the icon.
     aria-describedby still points at the <p>, whose accessible text is now exactly the message. -->
<th:block th:fragment="fieldError(field)">
    <p class="field-error" th:if="${#fields.hasErrors(field)}" th:id="${field} + '-error'">
        <svg class="icon" aria-hidden="true"><use th:href="@{/icons/phosphor.svg} + '#ph-warning-circle'"></use></svg>
        <span th:errors="*{__${field}__}"></span>
    </p>
</th:block>

<!-- The validation summary, derived from the binding result rather than from a hand-written list
     of which fields to mention.

     Every form in the app writes its own summary as an explicit <li th:if="hasErrors('thisField')">
     per field - which makes the summary a SECOND list of the form's validatable fields, and it
     drifts silently the moment a constraint is added to a field nobody remembered to add here. The
     failure mode is an alert that fires and names nothing: request-form.html listed only childId
     while NewRequestForm also has @NotNull on returnedAt, so submitting without the return time -
     the field the statutory 72-hour clock depends on, and the one 2e exists to make required -
     rendered "Before this request can be raised" above an EMPTY list. Status 200, banner present,
     nothing said.

     #fields.detailedErrors() cannot miss a field, because it reports what failed rather than being
     told what to ask about. Each entry links to its own control, and the inline message under that
     control (fieldError above) still says the same thing in place - the summary is the way in, not
     a replacement for it. Global errors have no field to link to, so they render as plain text
     rather than as a link to #null.

     Adopted by 2e here; the other nine forms carry the hand-written version still and should move
     to this one. -->
<th:block th:fragment="errorSummary(heading)">
    <div class="banner err" role="alert" th:if="${#fields.hasErrors('*')}">
        <svg class="icon ic" aria-hidden="true"><use th:href="@{/icons/phosphor.svg} + '#ph-warning-circle'"></use></svg>
        <div>
            <strong th:text="${heading}">Before this can be saved</strong>
            <ul>
                <li th:each="e : ${#fields.detailedErrors()}">
                    <a th:unless="${e.global}" th:href="'#' + ${e.fieldName}" th:text="${e.message}">Error</a>
                    <span th:if="${e.global}" th:text="${e.message}">Error</span>
                </li>
            </ul>
        </div>
    </div>
</th:block>

<!-- T165: a due state's glyph lives HERE, aria-hidden, and not in the Java that builds the
     announced text - inside th:text it is read out as the character's name ("circle with upper right
     quadrant black"), which is the exact converse of the rail defect: the state arrives, but as the
     wrong thing. The state reaches the reader as a word (DueStateCopy); this is decoration.
     Renders nothing for the two tiers that never had a glyph - NO_CLOCK, and the null state of the
     "No active deadline" group - which is what the unmatched th:switch does with no th:case="*". -->
<th:block th:fragment="dueIcon(state)" th:switch="${state?.name()}">
    <svg th:case="'OVERDUE'" class="icon" aria-hidden="true"><use th:href="@{/icons/phosphor.svg} + '#ph-warning-circle'"></use></svg>
    <svg th:case="'DUE_SOON'" class="icon" aria-hidden="true"><use th:href="@{/icons/phosphor.svg} + '#ph-clock-countdown'"></use></svg>
    <svg th:case="'ON_TRACK'" class="icon" aria-hidden="true"><use th:href="@{/icons/phosphor.svg} + '#ph-check-circle'"></use></svg>
</th:block>
<!-- T119 shell (phase 1): sidebar + header, inserted as a sibling immediately before each page's
     own <main id="main"> - the same insertion point the old plain <header> used - so no page
     template needs to change shape to adopt it (see app.css's shell section for how the fixed
     sidebar clears main without a shared wrapper element). The appearance and reveal controls are
     both now fully wired (batches 1b and 1c): per-user preference / session-backed one-shot flag,
     server-rendered, design spec §2.3/§2.5. -->
<!-- T138 (phase 2, batch 1a): aria-current, carried forward as an unfixed defect from the T86
     review ("aria-current is styled in app.css and set by no template - no page tells you where you
     are"). `path` comes from GlobalControllerAdvice's currentPath model attribute, not Thymeleaf's own
     #httpServletRequest (which evaluates to null in this app's wiring) - matched against each nav
     item's own href below, either exactly or as a path prefix (`path + '/'`) so a detail page under a
     section (e.g. /children/42) still marks that section's own nav link current. -->
<th:block th:fragment="nav" th:with="ico=@{/icons/phosphor.svg}, path=${currentPath}">
<a class="skip-link" href="#main">Skip to main content</a>

<aside class="shell-side">
    <div class="shell-brand">
        <span class="shell-brand-mark" aria-hidden="true"></span>
        <span class="shell-brand-name">Return Home</span>
    </div>

    <!-- Creed's review (spec 12d10e8): the name is useful information and stays, but the caret
         promised switching supplier/organisation, which isn't wired - removed along with the
         pointer cursor (app.css) until it is, so this reads as information, not a dead control. -->
    <div class="shell-org" th:if="${shellOrg != null}">
        <span style="flex:1;min-width:0">
            <span class="shell-org-label" th:text="${shellOrg.kicker()}">Supplier</span>
            <span class="shell-org-name" th:text="${shellOrg.name()}">Organisation</span>
        </span>
    </div>

    <nav class="shell-nav" aria-label="Main">
        <span class="shell-nav-group">Work</span>
        <a th:if="${#authorization.expression('hasAnyRole(''ORG_ADMIN'',''VIEWER'',''COORDINATOR'')')}" href="/dashboard"
           th:aria-current="${path == '/dashboard' or #strings.startsWith(path, '/dashboard/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-squares-four'"></use></svg>Dashboard</a>
        <a th:if="${#authorization.expression('hasRole(''HOME_STAFF'')')}" href="/requests"
           th:aria-current="${path == '/requests' or #strings.startsWith(path, '/requests/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-tray'"></use></svg>My Requests</a>
        <a th:if="${#authorization.expression('hasRole(''COORDINATOR'')')}" href="/coordinator/requests"
           th:aria-current="${path == '/coordinator/requests' or #strings.startsWith(path, '/coordinator/requests/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-tray'"></use></svg>All Requests</a>
        <a th:if="${#authorization.expression('hasRole(''VISITOR'')')}" href="/visitor/interviews"
           th:aria-current="${path == '/visitor/interviews' or #strings.startsWith(path, '/visitor/interviews/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-user-focus'"></use></svg>My Interviews</a>
        <a th:if="${#authorization.expression('hasRole(''REVIEWER'')')}" href="/reviewer/reports"
           th:aria-current="${path == '/reviewer/reports' or #strings.startsWith(path, '/reviewer/reports/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-seal-check'"></use></svg>Review Queue</a>

        <!-- T132: ONE "Records" group and ONE /children link, gated by the union of every role that
             used to gate either of the two separate blocks this replaced - HOME_STAFF ("My
             Children") and ADMIN/ORG_ADMIN/VIEWER/COORDINATOR ("Children") never lost or gained
             visibility, they just can no longer both render at once for a stacked-role account. See
             GlobalControllerAdvice#childrenNav / RoleMatrix#isChildrenListPersonalisedToOwnHomes for
             why the label, not the visibility, is the only thing that still varies by role. -->
        <span class="shell-nav-group"
              th:if="${childrenNav.visible() or #authorization.expression('hasRole(''COORDINATOR'')')}">Records</span>
        <a th:if="${childrenNav.visible()}" href="/children"
           th:aria-current="${path == '/children' or #strings.startsWith(path, '/children/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-users-three'"></use></svg>
            <span th:text="${childrenNav.label()}">Children</span>
        </a>
        <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ORG_ADMIN'')')}" href="/admin/homes"
           th:aria-current="${path == '/admin/homes' or #strings.startsWith(path, '/admin/homes/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-house-line'"></use></svg>Homes</a>
        <a th:if="${#authorization.expression('hasAnyRole(''ORG_ADMIN'',''VIEWER'',''COORDINATOR'',''ADMIN'')')}" href="/audit"
           th:aria-current="${path == '/audit' or #strings.startsWith(path, '/audit/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-clock-counter-clockwise'"></use></svg>Audit</a>

        <span class="shell-nav-group"
              th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ORG_ADMIN'')') or canEditTheme}">Admin</span>
        <!-- Creed's review (spec 12d10e8): Users and Children shared ph-users-three - the 55-icon
             set was sampled from the mockup screens, and the sidebar nav was never one of them, so
             it was never sized for a nav. ph-user-list (a person beside a list) is what this screen
             actually is; Children keeps the group glyph as the domain-central entity. -->
        <a th:if="${#authorization.expression('hasAnyRole(''ADMIN'',''ORG_ADMIN'')')}" href="/admin/users"
           th:aria-current="${path == '/admin/users' or #strings.startsWith(path, '/admin/users/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-user-list'"></use></svg>Users</a>
        <a th:if="${canEditTheme}" href="/admin/theme"
           th:aria-current="${path == '/admin/theme' or #strings.startsWith(path, '/admin/theme/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-eyedropper'"></use></svg>Branding</a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" href="/admin/organisations"
           th:aria-current="${path == '/admin/organisations' or #strings.startsWith(path, '/admin/organisations/')} ? 'page'">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-buildings'"></use></svg>Organisations</a>
    </nav>

    <div class="shell-user">
        <span class="shell-user-avatar" aria-hidden="true" th:text="${shellUserInitials}">AB</span>
        <span style="flex:1;min-width:0">
            <span class="shell-user-name" sec:authentication="name">Full Name</span>
        </span>
        <form method="post" th:action="@{/logout}">
            <button type="submit" title="Log out" aria-label="Log out">
                <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-sign-out'"></use></svg>
            </button>
        </form>
    </div>
</aside>

<header class="shell-header">
    <!-- Creed's review (spec 12d10e8): removed rather than left as a dead box. Search is a real,
         scoped feature ("Search child ref, home or visitor" per the canvas) tracked as its own
         ticket - a styled control that does nothing is worse than the empty space its absence
         leaves, since it invites a click that goes nowhere. Comes back when it's wired. -->
    <div class="shell-header-actions">
        <!-- T138 1c: revealing is a real POST + full-page redirect, not a client-side class toggle -
             a client-side toggle cannot be audited (Kevin's review: no server event, so nothing
             would record that someone unmasked a list of children). Masked is the state on every
             page load except the one immediately following this POST's own redirect - see
             NameRevealService's javadoc for why the flag is one-shot and resets on navigation.

             Creed's review: this needs an OFF switch too. A user who reveals to check a name has
             no way to cover the screen again short of leaving the page - on a part-filled form
             that means losing their place. Hiding is not itself privacy-sensitive (nothing is
             armed, nothing is audited - it's just a plain reload of the same page, which is
             already masked the moment reveal's one-shot flag is gone), so it's a plain link, not a
             second POST endpoint.

             Both states use Phosphor's regular/fill pair for an active state (Nocturne's own idiom,
             R-Q11) rather than one glyph doing double duty: ph-eye-slash masked, ph-fill-eye-slash
             revealed. -->
        <!-- Creed's follow-up review: no aria-pressed on either state. It's invalid on the <a>
             below (only supported on role="button", and adding that role would then obligate
             hand-wiring Space-key activation for what should stay a plain link). And it's the
             wrong pattern on the <button>, not just redundant there: aria-pressed exists for a
             control whose LABEL STAYS CONSTANT while its state changes (a Bold button, on or off)
             - this one's label changes between "Reveal" and "Hide", which already communicates the
             state through the accessible name, and carrying both would double the information (in
             the masked state it would read as a double negative: a control named "Reveal names on
             this page" announced as *not pressed*). The changing-label pattern and the
             constant-label-plus-aria-pressed pattern are two different, complete solutions - never
             combine them. The appearance cycle below already uses the changing-label pattern
             correctly with no aria-pressed; this brings the two header controls into line. -->
        <form th:if="${!namesRevealed}" method="post" th:action="@{/account/reveal-names}" class="shell-reveal-form">
            <input type="hidden" name="returnTo" th:value="${currentPath}">
            <button type="submit" class="shell-toggle shell-reveal-toggle">
                <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-eye-slash'"></use></svg>
                <span>Reveal</span>
                <!-- Spec §2.5: the control's accessible name must state what it does and what it
                     affects, not just its visible word - same WCAG 2.5.3 reasoning as the
                     appearance toggle below (Creed's review, PR #29). -->
                <span class="visually-hidden">names on this page</span>
            </button>
        </form>
        <a th:if="${namesRevealed}" th:href="${currentPath}" class="shell-toggle shell-reveal-toggle">
            <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-fill-eye-slash'"></use></svg>
            <span>Hide</span>
            <span class="visually-hidden">names on this page</span>
        </a>
        <!-- T138 batch 1b: a real POST + full-page redirect, not a client-side class toggle - spec
             §2.3 requires the appearance to be server-rendered with no flash, which a JS-driven
             instant swap can't give (the whole page, including this button's own icon/label below,
             has to come back freshly rendered from the new state). returnTo carries the shell's own
             currentPath so switching appearance from any page returns to that same page. -->
        <form method="post" th:action="@{/account/appearance}" class="shell-appearance-form">
            <input type="hidden" name="returnTo" th:value="${currentPath}">
            <input type="hidden" name="preference" th:value="${appearanceToggle.next()}">
            <!-- Creed's review (PR #29): the visible label alone ("Auto") names the STATE, not the
                 action a click performs - `title` isn't reliably announced, isn't shown on touch,
                 and is unreachable without a mouse to hover. The visually-hidden span completes the
                 accessible name into "Auto appearance - switch to light": it still contains the
                 visible word (WCAG 2.5.3 Label in Name - a voice-control user saying "click Auto"
                 still works), while a screen reader announces the destination, not just the state. -->
            <button type="submit" class="shell-toggle"
                    th:title="'Currently ' + ${appearanceToggle.label()} + ' appearance - switch to ' + ${#strings.toLowerCase(appearanceToggle.next())}">
                <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-' + ${appearanceToggle.icon()}"></use></svg>
                <span th:text="${appearanceToggle.label()}">Dark</span>
                <span class="visually-hidden"
                      th:text="' appearance - switch to ' + ${#strings.toLowerCase(appearanceToggle.next())}"></span>
            </button>
        </form>
        <svg class="icon shell-bell" aria-hidden="true"><use th:href="${ico} + '#ph-bell'"></use></svg>
    </div>
</header>
</th:block>
</body>
</html>
