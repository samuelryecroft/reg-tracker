<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Add Child — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>Add Child</h1>

    <div class="card">
        <form method="post" th:action="@{/children}" th:object="${form}">
            <!--/* D-5d-3 (spec §7g): a page-level condition, not a field error - homeId may not even
                 be on the page (single-home users never render it), there is no control this user
                 can fix, and the message already says so. No anchor offered. */-->
            <div class="banner err" role="alert" th:if="${orgInactiveError != null}">
                <span class="ic" aria-hidden="true">▲</span>
                <div><strong>This child cannot be added yet</strong><p th:text="${orgInactiveError}">Error</p></div>
            </div>

            <div class="banner err" role="alert" th:if="${#fields.hasErrors('*')}">
                <span class="ic" aria-hidden="true">▲</span>
                <div>
                    <strong>Before this child can be added</strong>
                    <ul>
                        <li th:if="${#fields.hasErrors('firstName')}"><a href="#firstName" th:text="${#fields.errors('firstName')[0]}">Error</a></li>
                        <li th:if="${#fields.hasErrors('lastName')}"><a href="#lastName" th:text="${#fields.errors('lastName')[0]}">Error</a></li>
                        <li th:if="${#fields.hasErrors('dateOfBirth')}"><a href="#dateOfBirth" th:text="${#fields.errors('dateOfBirth')[0]}">Error</a></li>
                        <li th:if="${#fields.hasErrors('homeId')}"><a href="#homeId" th:text="${#fields.errors('homeId')[0]}">Error</a></li>
                    </ul>
                </div>
            </div>

            <label for="firstName">First name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="firstName" th:field="*{firstName}" required
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('firstName')}" aria-describedby="firstName-error"/>
            <div th:replace="~{fragments/layout :: fieldError('firstName')}"></div>

            <label for="lastName">Last name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="lastName" th:field="*{lastName}" required
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('lastName')}" aria-describedby="lastName-error"/>
            <div th:replace="~{fragments/layout :: fieldError('lastName')}"></div>

            <!--/* D-5d-2 (spec §7g): max is the cheap client-side half - a birth date genuinely
                 cannot be in the future, the opposite ruling from 5b's scheduledAt (D-5b-3). */-->
            <label for="dateOfBirth">Date of birth <span class="req" aria-hidden="true">*</span></label>
            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}" required th:max="${dobMax}"
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('dateOfBirth')}" aria-describedby="dateOfBirth-error"/>
            <div th:replace="~{fragments/layout :: fieldError('dateOfBirth')}"></div>

            <label for="localCaseReference">Case reference (optional)</label>
            <!--/* D-5d-4: optional is correct - a child can exist here before intake assigns one -
                 but leaving it blank is a safeguarding trade-off (ChildIdentity's masked label
                 degrades to bare initials), and the person leaving it blank was told nothing. */-->
            <p class="hint">Used to tell children apart when names are masked. Can be added later.</p>
            <input type="text" id="localCaseReference" th:field="*{localCaseReference}"/>

            <div th:if="${needsHomePicker}">
                <label for="homeId">Home <span class="req" aria-hidden="true">*</span></label>
                <select id="homeId" th:field="*{homeId}" required
                        th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('homeId')}" aria-describedby="homeId-error">
                    <option value="">Select a home…</option>
                    <option th:each="h : ${homes}" th:value="${h.id}" th:text="${h.name}">Home</option>
                </select>
                <div th:replace="~{fragments/layout :: fieldError('homeId')}"></div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn">Add child</button>
                <a class="btn ghost" href="/children">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
