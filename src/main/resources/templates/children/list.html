<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Children — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1 th:text="${isAdmin} ? 'Children' : 'My Children'">Children</h1>
    <!-- The matrix, not a role flag. This hid the button from VIEWER only, so a supplier
         org-admin - who can reach this page - was offered an action the server then refused. -->
    <a class="btn" href="/children/new" th:if="${can.addChild}">Add child</a>

    <div class="table-wrap responsive">
    <table>
        <caption>All children, most recently added first.</caption>
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Date of birth</th>
            <th scope="col" th:if="${isAdmin}">Home</th>
            <th scope="col">Case reference</th>
        </tr>
        </thead>
        <tbody>
        <!--
          T193 (PILOT-GATE, spec §7f D-4b-11): the birth date and case reference are both
          Article-9 encrypted, so this row reads them only through childRows (built server-side in
          ChildController, same shape as childIdentities above) - never straight off the entity, or
          the mask is defeated on this masked page.
        -->
        <tr th:each="c : ${children}">
            <td th:text="${childIdentities[c.id].label()}">Child Name</td>
            <td th:text="${childRows[c.id].dob()}">DOB</td>
            <td th:if="${isAdmin}" th:text="${c.home.name}">Home</td>
            <td th:text="${childRows[c.id].caseReference()}">Case reference</td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="stack">
        <div class="srow" th:each="c : ${children}">
            <div class="top"><span class="name" th:text="${childIdentities[c.id].label()}">Child Name</span></div>
            <dl>
                <dt>Date of birth</dt><dd th:text="${childRows[c.id].dob()}">DOB</dd>
                <dt th:if="${isAdmin}">Home</dt><dd th:if="${isAdmin}" th:text="${c.home.name}">Home</dd>
                <dt>Case reference</dt><dd th:text="${childRows[c.id].caseReference()}">Case reference</dd>
            </dl>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(children)}">No children yet.</div>
</main>
</body>
</html>
