<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Young people — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <!--/* D-5d-1 (spec §7g): renamed from isAdmin - it never meant "is an administrator" here (a
         multi-home HOME_STAFF sees the column too), and a name after the mechanism it was written
         for rather than the property it encodes is exactly how a future reader mis-reasons about
         who this applies to. Named for what it decides, matching ChildController's own local var. */-->
    <!--/* T320/T250: the ruled split - a nav item NAMES, a page heading can EXPLAIN. "Young people in
         your homes" says why the list is shorter, which is worth saying once on the page and never in
         a fixed-width nav rail.
         DELIBERATELY still keyed on showHomeColumn and NOT on
         RoleMatrix#isChildrenListPersonalisedToOwnHomes, so this rename changes wording and nothing
         else. The two are NOT equivalent: showHomeColumn is homeIds.size() > 1 for HOME_STAFF
         (ChildController:89), while the predicate ignores how many homes. A HOME_STAFF with two homes
         is personalised to their own homes and still gets the column - so today the nav says "My
         Children" while this heading says "Children". That disagreement is PRE-EXISTING and is left
         exactly as it was; keying the heading to the predicate instead would be a behaviour change,
         and it belongs on its own card rather than inside a rename. */-->
    <h1 th:text="${showHomeColumn} ? 'Young people' : 'Young people in your homes'">Young people</h1>
    <!--/* The matrix, not a role flag. This hid the button from VIEWER only, so a supplier
         org-admin - who can reach this page - was offered an action the server then refused. */-->
    <a class="btn" href="/children/new" th:if="${can.addChild}">Add young person</a>

    <!--/*
      6a (spec §7b): children are people, not an aggregate - R-Q12 rules cards for people and
      tables for aggregates, so the table this page used to render alongside this same list is
      deleted rather than kept as a second copy. It was the strongest case on the floor for that
      backlog item (D-4b-1 cited it as evidence): the two renderings had already worded a null
      field two different ways because nobody reads both at once. One rendering now, so that class
      of drift has nowhere left to happen.

      T193 (PILOT-GATE, spec §7f D-4b-11): the birth date is Article-9 encrypted, so this row reads
      it only through childRows (built server-side in ChildController, same shape as
      childIdentities above) - never straight off the entity, or the mask is defeated on this
      masked page. The case reference goes through the same projection but is never gated - it is
      already shown, by design, in the name column's own masked label (see ChildListRow's javadoc
      for why gating this cell too would misreport its own state).
    */-->
    <div class="stack solo">
        <div class="srow" th:each="c : ${children}">
            <div class="top"><span class="name" th:text="${childIdentities[c.id].label()}">Child Name</span></div>
            <dl>
                <dt>Date of birth</dt><dd th:text="${childRows[c.id].dob()}">DOB</dd>
                <dt th:if="${showHomeColumn}">Home</dt><dd th:if="${showHomeColumn}" th:text="${c.home.name}">Home</dd>
                <dt>Case reference</dt><dd th:text="${childRows[c.id].caseReference()}">Case reference</dd>
            </dl>
        </div>
    </div>

    <!--/* R-Q13 (spec §5d), final copy - do not reword. */-->
    <div class="empty" th:if="${#lists.isEmpty(children)}">
        No young people added yet. Add a young person before you can raise an interview request.
        <a class="btn secondary" href="/children/new" th:if="${can.addChild}">Add a young person</a>
    </div>
</main>
</body>
</html>
