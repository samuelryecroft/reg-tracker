<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Allocate — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<!--
  T173(4a) / spec §7b: 2a's queue points its one action at this route, so it's the live seam
  between the redesigned and unredesigned halves of the app.
-->
<main id="main" th:with="ico=@{/icons/phosphor.svg}">
    <h1 th:text="${'Allocate: ' + childIdentity.label()}">Allocate</h1>
    <p class="muted" th:text="${'Home: ' + request.home.name}">Home</p>

    <!--
      D-4a-1: stays a route, deliberately not a dialog over the queue - the rule that separates
      this from D-1b-5's dialog: "a dialog is right when its content belongs to the page you are
      already on; it is wrong when its content belongs to one row of a list." 5c's send-back is
      about the one report being read; this form is about one of forty cards on the queue. A
      dialog here would need either an inline form per card or a fetch-and-inject script - and
      allocation is what starts the visitor's clock on a statutory deadline, so making it
      JS-dependent would be #71's send-back failure again, with more at stake. The thing a dialog
      was reaching for - not losing your place - comes free from returning to the queue with its
      filter preserved (Cancel below, and the redirect after a successful POST).
    -->
    <div class="card">
        <form method="post" th:action="@{/coordinator/requests/{id}/allocate(id=${request.id})}" th:object="${form}">
            <div class="banner err" role="alert" th:if="${#fields.hasErrors('*')}">
                <svg class="icon" aria-hidden="true"><use th:href="${ico} + '#ph-warning-circle'"></use></svg>
                <div>
                    <strong>Before this can be allocated</strong>
                    <ul><li th:if="${#fields.hasErrors('visitorId')}"><a href="#visitorId" th:text="${#fields.errors('visitorId')[0]}">Error</a></li></ul>
                </div>
            </div>

            <!--
              D-4a-2: "a coordinator allocating blind cannot load-balance, and an overloaded
              visitor is how a 72-hour deadline gets missed." A radio list, not the old dropdown -
              a dropdown option can't carry a second field, and the canvas already says list.
              Sorted least-loaded first (visitorsFor), because that's the choice this screen is
              for. Continuity (a returning child may be better served by the same visitor) is
              deliberately not designed here - flagged to Creed as a product question, not built.

              D-4a-4/D-4a-4b (spec §7c): a bare count is blunt on a 72-hour clock, so the load
              figure (VisitorOption.loadSummary) also names the single most constraining fact
              among that visitor's open work - the ladder is overdue -> due soon -> sent back ->
              nothing, e.g. "3 open allocations · 1 overdue" - and nothing when nothing on the
              ladder applies. D-4a-4a: deliberately one plain-muted span for the whole figure
              regardless of tier - no --error here, because on a person's row the same fact reads
              as "this visitor is already carrying pressure", not "this visitor is failing".
            -->
            <fieldset id="visitorId" aria-describedby="visitorId-error">
                <legend>Visitor <span class="req" aria-hidden="true">*</span></legend>
                <div class="radio-list">
                    <label class="radio" th:each="v : ${visitors}">
                        <input type="radio" th:field="*{visitorId}" th:value="${v.id()}" required/>
                        <span class="dot" aria-hidden="true"></span>
                        <span th:text="${v.fullName()}">Visitor name</span>
                        <span class="load" th:text="${v.loadSummary()}">No open allocations</span>
                    </label>
                </div>
            </fieldset>
            <div th:replace="~{fragments/layout :: fieldError('visitorId')}"></div>

            <label for="scheduledAt">Scheduled visit date/time</label>
            <input type="datetime-local" id="scheduledAt" th:field="*{scheduledAt}"/>
            <!--
              D-4a-3: the button used to read "Allocate & schedule" in both cases, but the real
              rule is no time -> Allocated (visitor confirms), time -> Scheduled - so with the
              time blank the old label named an effect that didn't happen. "A label that is true
              in both states beats a label that is right in one and wrong in the other" - so the
              button just says "Allocate" (true either way, since scheduling is an ADDITIONAL
              effect), and this line names both actual outcomes instead of describing the
              mechanism the old hint did ("leave blank for the visitor to arrange").
            -->
            <p class="hint">Leave blank and this becomes <strong>Allocated</strong>, for the visitor to
                arrange with the home. Set a time and it becomes <strong>Scheduled</strong>.</p>

            <div class="btn-row">
                <button type="submit" class="btn">Allocate</button>
                <a class="btn ghost" href="/coordinator/requests">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
