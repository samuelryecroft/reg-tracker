<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Enter your code — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<!--/* T353e step D. The password does NOT change until this code verifies. Copy is Creed's (T353h). */-->
<main id="main" class="narrow">
    <h1>Enter your code</h1>
    <div class="banner err" role="alert" th:if="${error}"><span th:text="${error}">error</span></div>
    <p class="sub">We've emailed a code to confirm this reset. It expires in 10 minutes.</p>
    <form method="post" th:action="@{/reset-password/verify}">
        <input type="hidden" name="token" th:value="${token}"/>
        <label for="code">Code</label>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus/>
        <button type="submit">Reset password</button>
    </form>
</main>
</body>
</html>
