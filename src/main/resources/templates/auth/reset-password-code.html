<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Enter your code — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<!--/* T353h, ruled copy. Step D - the password does NOT change until this code verifies.
     "This is the last step" is worth its words: the person has now been through a form, a mailbox,
     a second form and a second mailbox, and the commonest failure here is abandonment, not error.

     THE FIELD MATCHES auth/verify.html'S - inputmode, pattern, maxlength and autocomplete
     one-time-code - because the code is issued by the same generator at the same length, and a
     phone that offers the sign-in code from the message but not this one would be a difference with
     no cause. Copy differs from that page (this is not a sign-in); the INPUT CONTRACT does not. */-->
<main id="main" class="narrow">
    <h1>Enter your code</h1>
    <p class="sub">This is the last step. We've emailed a 6-digit code to the same address as the
        link. It expires in 10 minutes.</p>
    <div class="banner err" role="alert" th:if="${error}">
        <svg class="icon" aria-hidden="true"><use th:href="@{/icons/phosphor.svg} + '#ph-warning-circle'"></use></svg>
        <div><strong>That code wasn't right</strong><p th:text="${error}">error</p></div>
    </div>
    <div class="card">
        <form method="post" th:action="@{/reset-password/verify}">
            <input type="hidden" name="token" th:value="${token}"/>
            <label for="code">Security code</label>
            <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*"
                   maxlength="6" autocomplete="one-time-code" required autofocus/>
            <div class="btn-row"><button type="submit" class="btn block">Change my password</button></div>
        </form>
    </div>
    <p class="sub" style="margin-top:16px">Didn't get the code? Check the junk folder, or
        <a th:href="@{/forgot-password}">start the reset again</a>.</p>
</main>
</body>
</html>
