<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Reset your password — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<!--/* T353h, ruled copy. The invariant T353d set is unchanged and is not mine to relax: this page
     and its confirmation must never tell the visitor whether an account exists.

     WHY THIS PAGE NAMES THE WHOLE JOURNEY UP FRONT ("a link... then a code"). The flow has four
     steps and the person is holding none of the context: they are locked out, probably on a phone,
     and every step after this one arrives by email. A person who is told to expect ONE email stops
     watching after the link - and the code email is the one that actually completes the reset. The
     cost of not saying it is an abandoned reset that looks, from the outside, like mail not
     arriving. Say the shape once, here, where it is still cheap.

     It does NOT say "for security" or "to keep your account safe". That phrasing asks the reader to
     accept a cost on trust; naming the steps lets them plan. */-->
<main id="main" class="narrow">
    <h1>Reset your password</h1>
    <p class="sub">Enter the email address you sign in with. We'll send a link to set a new password,
        then a code to confirm it's you.</p>
    <div class="card">
        <form method="post" th:action="@{/forgot-password}">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" required autofocus/>
            <div class="btn-row"><button type="submit" class="btn block">Send reset link</button></div>
        </form>
    </div>
    <p class="sub" style="margin-top:16px"><a th:href="@{/login}">Back to sign in</a></p>
</main>
</body>
</html>
