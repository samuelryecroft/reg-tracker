<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Reset your password — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<!--/* T353d. Copy is a working placeholder; the ruled wording is Creed's (T353h). The one thing
     that is NOT cosmetic and must not change: this page and its confirmation must never tell the
     visitor whether an account exists. */-->
<main id="main" class="narrow">
    <h1>Reset your password</h1>
    <p class="sub">Enter your email address and we'll send you a link to set a new password.</p>
    <form method="post" th:action="@{/forgot-password}">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required autofocus/>
        <button type="submit">Send reset link</button>
    </form>
    <p><a th:href="@{/login}">Back to sign in</a></p>
</main>
</body>
</html>
