<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Check your email — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<!--/* T353d. THE NEUTRAL CONFIRMATION. This exact page is shown for a match, a no-match, a disabled
     account, the break-glass account and a throttled request alike - it is the visible half of the
     enumeration defence, and it must say the same thing in every case. "If there is an account"
     is load-bearing, not politeness: it neither confirms nor denies that the address is known.
     Ruled copy is Creed's (T353h); the invariant (no branch, no difference) is not negotiable. */-->
<main id="main" class="narrow">
    <h1>Check your email</h1>
    <p>If there is an account for that address, we've sent a link to reset the password. The link
        expires in 30 minutes.</p>
    <p>If nothing arrives, check the address and try again.</p>
    <p><a th:href="@{/login}">Back to sign in</a></p>
</main>
</body>
</html>
