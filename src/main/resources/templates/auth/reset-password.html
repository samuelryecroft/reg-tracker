<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Set a new password — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<!--/* T353e step B/C. Copy is a working placeholder; ruled wording is Creed's (T353h). */-->
<main id="main" class="narrow">
    <h1>Set a new password</h1>
    <div class="banner err" role="alert" th:if="${error}"><span th:text="${error}">error</span></div>
    <p class="sub">Choose a new password. We'll then email you a code to confirm it's you.</p>
    <form method="post" th:action="@{/reset-password}">
        <input type="hidden" name="token" th:value="${token}"/>
        <label for="newPassword">New password</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" required autofocus/>
        <button type="submit">Continue</button>
    </form>
</main>
</body>
</html>
