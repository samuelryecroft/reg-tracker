<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Log in — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<main id="main" style="max-width: 380px;">
    <h1>Return Home Tracker</h1>
    <div class="card">
        <p th:if="${param.error}" class="error">Invalid username or password.</p>
        <p th:if="${param.logout}" class="muted">You have been logged out.</p>
        <form method="post" th:action="@{/login}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autofocus="autofocus"/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password"/>
            <button type="submit" class="btn">Log in</button>
        </form>
    </div>
</main>
</body>
</html>
