<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${'Edit User: ' + user.username}">Edit User</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1 th:text="${'Edit User: ' + user.username}">Edit User</h1>
    <div class="card">
        <form method="post" th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${form}">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}"/>

            <label>Roles</label>
            <div class="checkbox-group">
                <label class="checkbox-option" th:each="r : ${roles}">
                    <input type="checkbox" th:field="*{roles}" th:value="${r}"/>
                    <span th:text="${r}">ROLE</span>
                </label>
            </div>

            <div id="homeField" th:if="${homes != null}">
                <label for="homeId">Home</label>
                <select id="homeId" th:field="*{homeId}">
                    <option value="">—</option>
                    <option th:each="h : ${homes}" th:value="${h.id}" th:text="${h.name}">Home</option>
                </select>
            </div>

            <div id="organisationField" th:if="${organisations != null}">
                <label for="organisationId">Organisation</label>
                <select id="organisationId" th:field="*{organisationId}">
                    <option value="">—</option>
                    <option th:each="o : ${organisations}" th:value="${o.id}" th:text="${o.name + ' (' + o.type + ')'}">Organisation</option>
                </select>
            </div>

            <div id="viewerHomesField" th:if="${homes != null}">
                <label>Homes this Viewer can see</label>
                <div class="checkbox-group">
                    <label class="checkbox-option" th:each="h : ${homes}">
                        <input type="checkbox" th:field="*{viewerHomeIds}" th:value="${h.id}"/>
                        <span th:text="${h.name}">Home</span>
                    </label>
                </div>
            </div>

            <label for="enabled">Enabled</label>
            <select id="enabled" th:field="*{enabled}">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>

            <label for="newPassword">Reset password (leave blank to keep current password)</label>
            <input type="password" id="newPassword" th:field="*{newPassword}"/>

            <button type="submit" class="btn">Save changes</button>
            <a class="btn secondary" href="/admin/users">Cancel</a>
        </form>
    </div>
</main>
<script th:src="@{/js/role-constraints.js}"></script>
</body>
</html>
