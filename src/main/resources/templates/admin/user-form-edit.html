<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${'Edit User: ' + user.username}">Edit User</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1 th:text="${'Edit User: ' + user.username}">Edit User</h1>

    <div class="card">
        <form method="post" th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${form}">
            <div class="banner err" role="alert" th:if="${#fields.hasErrors('*')}">
                <span class="ic" aria-hidden="true">▲</span>
                <div>
                    <strong>Before these changes can be saved</strong>
                    <ul>
                        <li th:if="${#fields.hasErrors('fullName')}"><a href="#fullName" th:text="${#fields.errors('fullName')[0]}">Error</a></li>
                        <li th:if="${#fields.hasErrors('newPassword')}"><a href="#newPassword" th:text="${#fields.errors('newPassword')[0]}">Error</a></li>
                    </ul>
                </div>
            </div>

            <label for="fullName">Full name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="fullName" th:field="*{fullName}" required
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('fullName')}" aria-describedby="fullName-error"/>
            <div th:replace="~{fragments/layout :: fieldError('fullName')}"></div>

            <fieldset class="checkbox-fieldset">
                <legend>Roles</legend>
                <div class="checkbox-group">
                    <label class="checkbox-option" th:each="r : ${roles}">
                        <input type="checkbox" th:field="*{roles}" th:value="${r}"/>
                        <span th:text="${r}">ROLE</span>
                    </label>
                </div>
                <p class="constraint-note" id="roleConstraintNote" aria-live="polite"></p>
            </fieldset>

            <div id="homeField" th:if="${homes != null}">
                <label for="homeId">Home</label>
                <select id="homeId" th:field="*{homeId}">
                    <option value="">—</option>
                    <option th:each="h : ${homes}" th:value="${h.id}" th:text="${h.name}">Home</option>
                </select>
            </div>

            <div id="organisationField" th:if="${organisations != null}">
                <label for="organisationId">Organisation</label>
                <select id="organisationId" th:field="*{organisationId}">
                    <option value="">—</option>
                    <option th:each="o : ${organisations}" th:value="${o.id}" th:text="${o.name + ' (' + o.type + ')'}">Organisation</option>
                </select>
            </div>

            <fieldset class="checkbox-fieldset" id="viewerHomesField" th:if="${homes != null}">
                <legend>Homes this Viewer can see</legend>
                <div class="checkbox-group">
                    <label class="checkbox-option" th:each="h : ${homes}">
                        <input type="checkbox" th:field="*{viewerHomeIds}" th:value="${h.id}"/>
                        <span th:text="${h.name}">Home</span>
                    </label>
                </div>
            </fieldset>

            <label for="enabled">Enabled</label>
            <select id="enabled" th:field="*{enabled}">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>

            <label for="newPassword">Reset password (leave blank to keep current password)</label>
            <p class="hint">At least 8 characters if you set one.</p>
            <input type="password" id="newPassword" th:field="*{newPassword}" autocomplete="new-password"
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('newPassword')}" aria-describedby="newPassword-error"/>
            <div th:replace="~{fragments/layout :: fieldError('newPassword')}"></div>

            <div class="btn-row">
                <button type="submit" class="btn">Save changes</button>
                <a class="btn ghost" href="/admin/users">Cancel</a>
            </div>
        </form>
    </div>

    <div class="card">
        <h2 style="margin-top:0">History</h2>
        <div th:replace="~{fragments/audit-history :: provenance}"></div>
        <div th:replace="~{fragments/audit-history :: timeline(${auditHistory})}"></div>
    </div>
</main>
<script th:src="@{/js/role-constraints.js}"></script>
</body>
</html>
