<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${'Edit User: ' + user.username}">Edit User</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1 th:text="${'Edit User: ' + user.username}">Edit User</h1>

    <div class="card">
        <form method="post" th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${form}">
            <div class="banner err" role="alert" th:if="${#fields.hasErrors('*')}">
                <span class="ic" aria-hidden="true">▲</span>
                <div>
                    <strong>Before these changes can be saved</strong>
                    <ul>
                        <li th:if="${#fields.hasErrors('firstName')}"><a href="#firstName" th:text="${#fields.errors('firstName')[0]}">Error</a></li>
                        <li th:if="${#fields.hasErrors('lastName')}"><a href="#lastName" th:text="${#fields.errors('lastName')[0]}">Error</a></li>
                        <li th:if="${#fields.hasErrors('contactPhone')}"><a href="#contactPhone" th:text="${#fields.errors('contactPhone')[0]}">Error</a></li>
                    </ul>
                </div>
            </div>

            <label for="firstName">First name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="firstName" th:field="*{firstName}" required autocomplete="given-name"
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('firstName')}" aria-describedby="firstName-error"/>
            <div th:replace="~{fragments/layout :: fieldError('firstName')}"></div>

            <label for="lastName">Last name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="lastName" th:field="*{lastName}" required autocomplete="family-name"
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('lastName')}" aria-describedby="lastName-error"/>
            <div th:replace="~{fragments/layout :: fieldError('lastName')}"></div>

            <!--/* T323: VISIBLE, NOT EDITABLE - the same shape T273 used for a colleague's row, and
                 for a related reason. The address is shown because an administrator looking at an
                 account needs to know which address it uses; it is not an input because SIGN-IN
                 CODES GO TO IT (T322), and a colleague who could change it could redirect them and
                 then act as this person, under this person's name, in a safeguarding record.

                 Removing the input is only half of it - EditUserForm has no email field at all, so
                 a hand-crafted POST carries nothing to apply. A form control is not a constraint: it
                 shapes the form, not the request.

                 DO NOT RESTORE THIS AS A USABILITY FIX. The pressure is real - an address mistyped
                 at creation cannot be corrected from here - and the answer to it is the link below,
                 not this input.

                 WHAT IT BUYS, measured: setPassword has no platform-admin guard, so a manager may
                 set an existing colleague's PASSWORD - but not their address. Under a second factor
                 the code therefore still goes to the real person's mailbox and the manager is
                 stopped. Putting this input back hands that impersonation capability straight back.

                 (Emailed codes rest on this plus one other thing - no self-service password reset,
                 or one mailbox would hold both factors. A third condition, "verified on first use",
                 was specified in T322 and has since been built - but it proves an address is
                 DELIVERABLE, not who owns it, so it bounds a mistyped address and is not a third
                 leg. Two things, not three. UserService.changeEmail carries the whole argument.) */-->
            <p class="field">
                <span class="lbl">Email address</span>
                <span th:text="${user.email} ?: 'Not recorded'">someone@example.org</span>
            </p>

            <label for="contactPhone">Contact phone number</label>
            <p class="hint">Optional.</p>
            <input type="tel" id="contactPhone" th:field="*{contactPhone}" autocomplete="tel"
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('contactPhone')}" aria-describedby="contactPhone-error"/>
            <div th:replace="~{fragments/layout :: fieldError('contactPhone')}"></div>

            <fieldset class="checkbox-fieldset">
                <legend>Roles</legend>
                <div class="checkbox-group">
                    <label class="checkbox-option" th:each="r : ${roles}">
                        <input type="checkbox" th:field="*{roles}" th:value="${r}"/>
                        <span th:text="${r.displayName}">Role</span>
                    </label>
                    <!--/* T275. Roles this person holds that YOU cannot assign. Oscar's rule is
                         "a role the actor cannot grant, they cannot remove: VISIBLE, NOT EDITABLE",
                         and before this they were neither - the loop above renders only the actor's
                         assignable roles, so such a role had no checkbox at all and was replaced
                         away by a save that never mentioned it.

                         Checked and disabled. A disabled checkbox submits nothing, which is exactly
                         right: UserService merges it back from the TARGET's own roles rather than
                         trusting the form to carry something it was never shown. The two halves are
                         deliberately independent - the server does not rely on this markup, and this
                         markup does not rely on the server, because the failure being fixed is one
                         where each silently assumed the other had it. */-->
                    <label class="checkbox-option" th:each="r : ${rolesYouCannotChange}">
                        <input type="checkbox" checked="checked" disabled="disabled" th:value="${r}"/>
                        <span th:text="${r.displayName}">Role</span>
                        <span class="hint">You cannot change this role</span>
                    </label>
                </div>
                <p class="constraint-note" id="roleConstraintNote" aria-live="polite"></p>
            </fieldset>


            <div id="organisationField" th:if="${organisations != null}">
                <label for="organisationId">Organisation</label>
                <select id="organisationId" th:field="*{organisationId}">
                    <option value="">—</option>
                    <option th:each="o : ${organisations}" th:value="${o.id}" th:text="${o.name + ' (' + o.type + ')'}">Organisation</option>
                </select>
            </div>

            <fieldset class="checkbox-fieldset" id="homesField" th:if="${homes != null}">
                <legend>Homes</legend>
                <div class="checkbox-group">
                    <label class="checkbox-option" th:each="h : ${homes}">
                        <input type="checkbox" th:field="*{homeIds}" th:value="${h.id}"/>
                        <span th:text="${h.name}">Home</span>
                    </label>
                </div>
            </fieldset>

            <label for="enabled">Enabled</label>
            <select id="enabled" th:field="*{enabled}">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>

            <div class="btn-row">
                <button type="submit" class="btn">Save changes</button>
                <a class="btn ghost" href="/admin/users">Cancel</a>
            </div>
        </form>

        <!--/* T277: setting a password is its own ACTION on its own screen rather than a field in
             this bundle. A permission to reach a form is a permission to everything in it, so while
             the credential lived here, any widening of "who may edit this user" silently widened
             "who may set their password" - which happened twice. The link is offered to the same
             audience and behind the same authorisation check; it is simply no longer carried along
             by a different one. The old hint here also still said "at least 8 characters", which
             T272 replaced months ago and nobody re-read - a field's copy rots where the field is
             not the point of the screen. */-->
        <p class="field">
            <a class="rowlink" th:href="@{/admin/users/{id}/password(id=${user.id})}">Set this user's password</a>
        </p>

        <!--/* T323: the route out, so the narrowing is not a dead end. Offered only where it will
             work - a platform admin - because a link that 403s teaches a manager that the product is
             broken rather than that the rule exists. The check here is presentation; the rule is in
             UserService.changeEmail, which refuses the GET as well as the POST. */-->
        <p class="field" th:if="${can.changeAnyEmail}">
            <a class="rowlink" th:href="@{/admin/users/{id}/email(id=${user.id})}">Change this user's email address</a>
        </p>
    </div>

    <div class="card">
        <h2 style="margin-top:0">History</h2>
        <div th:replace="~{fragments/audit-history :: provenance}"></div>
        <div th:replace="~{fragments/audit-history :: timeline(${auditHistory})}"></div>
    </div>
</main>
<script th:src="@{/js/role-constraints.js}"></script>
</body>
</html>
