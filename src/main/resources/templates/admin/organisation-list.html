<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Organisations — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>Organisations</h1>

    <div class="banner warn" th:if="${kekWarning != null}" role="status">
        <span class="ic" aria-hidden="true">◆</span>
        <div>
            <strong>Encryption key not yet provisioned</strong>
            <p th:text="${kekWarning}">The care provider’s encryption key is not yet provisioned.</p>
        </div>
    </div>

    <a class="btn" href="/admin/organisations/new" th:if="${can.addOrganisation}">Add organisation</a>

    <div class="table-wrap responsive">
    <table>
        <caption>All organisations on the platform.</caption>
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Type</th>
            <th scope="col">Supplier</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${organisations}">
            <td th:text="${o.name}">Name</td>
            <td th:text="${o.type}">Type</td>
            <td th:text="${o.supplierOrganisation} ? ${o.supplierOrganisation.name} : '—'">Supplier</td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="stack">
        <div class="srow" th:each="o : ${organisations}">
            <div class="top"><span class="name" th:text="${o.name}">Name</span></div>
            <dl>
                <dt>Type</dt><dd th:text="${o.type}">Type</dd>
                <dt>Supplier</dt><dd th:text="${o.supplierOrganisation} ? ${o.supplierOrganisation.name} : '—'">Supplier</dd>
            </dl>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(organisations)}">No organisations yet.</div>
</main>
</body>
</html>
