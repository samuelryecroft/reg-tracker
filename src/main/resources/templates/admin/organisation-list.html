<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Organisations — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main>
    <h1>Organisations</h1>
    <a class="btn" href="/admin/organisations/new">Add organisation</a>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Type</th>
            <th>Supplier</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${organisations}">
            <td th:text="${o.name}">Name</td>
            <td th:text="${o.type}">Type</td>
            <td th:text="${o.supplierOrganisation} ? ${o.supplierOrganisation.name} : '—'">Supplier</td>
        </tr>
        <tr th:if="${#lists.isEmpty(organisations)}">
            <td colspan="3" class="muted">No organisations yet.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
