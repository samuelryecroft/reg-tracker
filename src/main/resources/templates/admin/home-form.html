<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Add Home — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>Add Home</h1>

    <div class="card">
        <form method="post" th:action="@{/admin/homes}" th:object="${form}">
            <div class="banner err" role="alert" th:if="${#fields.hasErrors('*')}">
                <span class="ic" aria-hidden="true">▲</span>
                <div>
                    <strong>Before this home can be added</strong>
                    <ul>
                        <li th:if="${#fields.hasErrors('name')}"><a href="#name" th:text="${#fields.errors('name')[0]}">Error</a></li>
                        <li th:if="${#fields.hasErrors('organisationId')}"><a href="#organisationId" th:text="${#fields.errors('organisationId')[0]}">Error</a></li>
                    </ul>
                </div>
            </div>

            <label for="name">Name <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="name" th:field="*{name}" required
                   th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('name')}" aria-describedby="name-error"/>
            <div th:replace="~{fragments/layout :: fieldError('name')}"></div>

            <div th:if="${organisations != null}">
                <label for="organisationId">Care provider organisation <span class="req" aria-hidden="true">*</span></label>
                <select id="organisationId" th:field="*{organisationId}" required
                        th:errorclass="is-invalid" th:aria-invalid="${#fields.hasErrors('organisationId')}" aria-describedby="organisationId-error">
                    <option value="">Select a care provider…</option>
                    <option th:each="o : ${organisations}" th:value="${o.id}" th:text="${o.name}">Organisation</option>
                </select>
                <div th:replace="~{fragments/layout :: fieldError('organisationId')}"></div>
            </div>

            <label for="addressLine1">Address line 1</label>
            <input type="text" id="addressLine1" th:field="*{addressLine1}"/>

            <label for="addressLine2">Address line 2</label>
            <input type="text" id="addressLine2" th:field="*{addressLine2}"/>

            <label for="addressLine3">Address line 3</label>
            <input type="text" id="addressLine3" th:field="*{addressLine3}"/>

            <label for="postcode">Postcode</label>
            <input type="text" id="postcode" th:field="*{postcode}"/>

            <label for="what3words">what3words</label>
            <p class="hint">e.g. ///filled.count.soap</p>
            <input type="text" id="what3words" th:field="*{what3words}"/>

            <label for="localAuthority">Local authority</label>
            <input type="text" id="localAuthority" th:field="*{localAuthority}"/>

            <div class="btn-row">
                <button type="submit" class="btn">Create home</button>
                <a class="btn ghost" href="/admin/homes">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
