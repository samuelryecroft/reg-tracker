<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Homes — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>Homes</h1>
    <a th:if="${canCreate}" class="btn" href="/admin/homes/new">Add home</a>

    <div class="table-wrap responsive">
    <table>
        <caption>All children's homes.</caption>
        <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Organisation</th>
            <th scope="col">Address</th>
            <th scope="col">Local authority</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="h : ${homes}">
            <td th:text="${h.name}">Home name</td>
            <td th:text="${h.organisation.name}">Organisation</td>
            <td th:text="${h.fullAddress} ?: '—'">Address</td>
            <td th:text="${h.localAuthority} ?: '—'">Local authority</td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="stack">
        <div class="srow" th:each="h : ${homes}">
            <div class="top"><span class="name" th:text="${h.name}">Home name</span></div>
            <dl>
                <dt>Organisation</dt><dd th:text="${h.organisation.name}">Organisation</dd>
                <dt>Address</dt><dd th:text="${h.fullAddress} ?: '—'">Address</dd>
                <dt>Local authority</dt><dd th:text="${h.localAuthority} ?: '—'">Local authority</dd>
            </dl>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(homes)}">No homes yet.</div>
</main>
</body>
</html>
