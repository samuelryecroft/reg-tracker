<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Homes — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>Homes</h1>
    <a th:if="${can.addHome}" class="btn" href="/admin/homes/new">Add home</a>

    <!--/*
      4e, the management half. The TREE on /admin/organisations is now where homes are browsed -
      it shows each care provider with its homes, which is the relationship this flat list could
      never express. THIS screen keeps the job the tree does not do: adding and editing. 6d needs
      home-form.html regardless, so there was never a version of this where the route disappears.
      (Pam's read, Creed confirming.)

      The <table>/card-stack duplication goes for the same R-Q12 reason as 4d and 6a. Homes are
      not an aggregate - they are the places a child comes back to.

      UNLIKE 4d and 4e, THE TWO RENDERINGS HERE HAD NOT DRIFTED: both wrote a missing address and
      a missing local authority as the same em dash. I had written that they had, on the strength
      of the other two screens, and checked before shipping it - which is the whole of why it is
      worth saying here. This is the same duplication BEFORE it costs anything; the other two are
      what it looks like afterwards. The reason to remove it is that it is a second copy, not that
      it has already gone wrong.
    */-->
    <div class="case-list">
        <div class="case" th:each="h : ${homes}">
            <span class="case-link">
                <svg class="icon org-icon" aria-hidden="true"><use th:href="@{/icons/phosphor.svg} + '#ph-buildings'"></use></svg>
                <span class="case-ident">
                    <span class="case-name" th:text="${h.name}">Oakwood House</span>
                    <span class="case-meta" th:text="${h.organisation.name}">Harbourside Children&#39;s Care</span>
                </span>
            </span>
            <span class="case-aside">
                <span class="lbl">Address</span>
                <span th:text="${h.fullAddress} ?: 'Not recorded'">Address</span>
            </span>
            <span class="case-aside">
                <span class="lbl">Local authority</span>
                <span th:text="${h.localAuthority} ?: 'Not recorded'">Local authority</span>
            </span>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(homes)}">No homes yet.</div>
</main>
</body>
</html>
