<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Users — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>Users</h1>
    <a class="btn" href="/admin/users/new">Add user</a>

    <div class="table-wrap responsive">
    <table>
        <caption>All user accounts.</caption>
        <thead>
        <tr>
            <th scope="col">Username</th>
            <th scope="col">Full name</th>
            <th scope="col">Roles</th>
            <th scope="col">Homes</th>
            <th scope="col">Organisation</th>
            <th scope="col">Enabled</th>
            <th scope="col" class="visually-hidden">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.username}">username</td>
            <td th:text="${u.fullName}">Full Name</td>
            <td th:text="${#strings.setJoin(u.roles, ', ')}">ROLES</td>
            <td th:text="${#lists.isEmpty(u.homes)} ? '—' : ${#strings.listJoin(u.homes.![name], ', ')}">Homes</td>
            <td th:text="${u.organisation} ? ${u.organisation.name} : '—'">Organisation</td>
            <td th:text="${u.enabled} ? 'Yes' : 'No'">Enabled</td>
            <td><a class="rowlink" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Edit</a></td>
        </tr>
        </tbody>
    </table>
    </div>

    <div class="stack">
        <div class="srow" th:each="u : ${users}">
            <div class="top"><span class="name" th:text="${u.username}">username</span></div>
            <dl>
                <dt>Full name</dt><dd th:text="${u.fullName}">Full Name</dd>
                <dt>Roles</dt><dd th:text="${#strings.setJoin(u.roles, ', ')}">ROLES</dd>
                <dt th:unless="${#lists.isEmpty(u.homes)}">Homes</dt><dd th:unless="${#lists.isEmpty(u.homes)}" th:text="${#strings.listJoin(u.homes.![name], ', ')}">Homes</dd>
                <dt th:if="${u.organisation}">Organisation</dt><dd th:if="${u.organisation}" th:text="${u.organisation.name}">Organisation</dd>
                <dt>Enabled</dt><dd th:text="${u.enabled} ? 'Yes' : 'No'">Enabled</dd>
            </dl>
            <div class="act"><a class="btn ghost" th:href="@{/admin/users/{id}/edit(id=${u.id})}">Edit</a></div>
        </div>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(users)}">No users yet.</div>
</main>
</body>
</html>
