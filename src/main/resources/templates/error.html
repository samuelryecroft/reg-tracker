<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Error — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<main id="main" style="max-width: 480px;">
    <h1 th:text="${status} ?: 'Error'">Error</h1>
    <p class="error" th:text="${message} ?: 'Something went wrong.'">Message</p>
    <a class="btn secondary" href="/">Back home</a>
</main>
</body>
</html>
