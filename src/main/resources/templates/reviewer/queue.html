<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>Review Queue — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>Reports Awaiting Review</h1>

    <!--/*
      Screen 2d, on the shared case card (S-1). The table and its duplicate .stack card list are
      both gone: they were two renderings of one dataset, which is the drift class §6b exists to
      delete, and R-Q12 rules cards for cases.

      2d has no urgency tiers - the clock stops when the interview is held, so every row here is
      past it and DeadlineTracker returns no state. The card's deadline tag is therefore absent
      rather than empty: a request with no live clock has no deadline STATE, and a "—" would be
      claiming one. What a reviewer needs instead is how long the report has been waiting, which is
      what the meta line carries.
    */-->
    <!--/* T253 (spec 8f/9681e6d): <ul>/<li>, not <div> - fragments/case-card.html's root is
         <li role="listitem">, th:replace substitutes it for this placeholder tag entirely, so only
         the container needs changing here. role="list" is load-bearing, see app.css's own comment
         on .case-list for why. */-->
    <ul class="case-list" role="list" th:if="${!#lists.isEmpty(queue.reviewable())}">
        <th:block th:each="r : ${queue.reviewable()}" th:with="report=${reports[r.id]}">
            <div th:replace="~{fragments/case-card :: caseCard(
                    identity=${childIdentities[r.child.id]},
                    href=@{/interview-requests/{id}(id=${r.id})},
                    meta=${r.home.name + (report != null and report.submittedAt != null
                            ? ' · submitted ' + #temporals.format(report.submittedAt, 'dd MMM yyyy, HH:mm')
                            : '')},
                    asideLabel='Visitor',
                    aside=${r.allocatedVisitor != null ? r.allocatedVisitor.fullName : 'Not recorded'},
                    badge=null,
                    status=${r.status},
                    actionLabel='Review',
                    actionHref=@{/reviewer/reports/{id}/review(id=${r.id})},
                    noAction=null,
                    noteLabel=null,
                    note=null)}"></div>
        </th:block>
    </ul>

    <!--/*
      D-2d-1: a report this reviewer submitted themselves gets a card with NO action and the reason
      there is none - never a disabled button. D-1b-7's reasoning transfers, and a queue card is not
      the honest exception to it: a disabled control is not focusable, so it cannot explain itself,
      and this rule is PERMANENT - nothing could later enable the button. The card is safe to show
      because the rule is enforced at the endpoint (ReportService.getReviewable), not by hiding the
      row; hiding it is what made "no work" and "work you can't do" read identically.
    */-->
    <section class="case-group" th:if="${!#lists.isEmpty(queue.yourOwn())}">
        <h2 class="case-group-head">
            <span>Waiting, but not yours to review</span>
            <span class="case-group-count" th:text="${#lists.size(queue.yourOwn())}">1</span>
            <span class="visually-hidden" th:text="${#lists.size(queue.yourOwn()) == 1} ? 'report' : 'reports'">reports</span>
        </h2>
        <!--/* T253 (spec 8f/9681e6d): <ul>/<li>, not <div>, same reasoning as the reviewable list
             above. */-->
        <ul class="case-list" role="list">
            <th:block th:each="r : ${queue.yourOwn()}" th:with="report=${reports[r.id]}">
                <div th:replace="~{fragments/case-card :: caseCard(
                        identity=${childIdentities[r.child.id]},
                        href=@{/interview-requests/{id}(id=${r.id})},
                        meta=${r.home.name + (report != null and report.submittedAt != null
                                ? ' · submitted ' + #temporals.format(report.submittedAt, 'dd MMM yyyy, HH:mm')
                                : '')},
                        asideLabel='Visitor',
                        aside=${r.allocatedVisitor != null ? r.allocatedVisitor.fullName : 'Not recorded'},
                        badge=null,
                        status=${r.status},
                        actionLabel=null,
                        actionHref=null,
                        noAction='You submitted this report',
                        noteLabel=null,
                        note=null)}"></div>
            </th:block>
        </ul>
    </section>

    <!--/*
      R-Q13: the two empty states are different facts and must not share words. "Nothing is waiting"
      and "everything waiting is yours" were previously indistinguishable, because the second set of
      rows was discarded before the screen ever saw it - an empty list reading as an all-clear when
      there is in fact work, which is Oscar's named danger for a safeguarding queue.
    */-->
    <div class="empty" th:if="${queue.isAllYourOwn()}">
        The reports waiting were all submitted by you, so you can't review them yourself. Another
        reviewer will pick them up.
    </div>
    <div class="empty" th:if="${queue.isEmpty()}">
        Nothing is waiting for review. Reports appear here when a visitor submits them.
    </div>
</main>
</body>
</html>
