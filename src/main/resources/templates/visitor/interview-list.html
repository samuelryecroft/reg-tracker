<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" th:attr="data-appearance=${#strings.toLowerCase(appearancePreference)}">
<head>
    <meta charset="UTF-8"/>
    <title>My Interviews — Return Home Tracker</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>
<div th:replace="~{fragments/layout :: nav}"></div>
<main id="main">
    <h1>My Allocated Interviews</h1>

    <!--/*
      Screen 2f, on the shared case card (S-1). The table and its duplicate .stack list are gone.

      "One card per state, with only its own action" is what this screen already did - what changes
      is that it now does it once instead of twice, and that the sent-back card carries the
      reviewer's comment, which is the thing the visitor actually has to act on. Reading it used to
      require leaving the list.

      D-2a-1, the UNGROUPED half: these cards are not under urgency tier headings, so nothing else
      on the screen supplies the tier and the due tag has to carry the state word AS WELL AS the
      magnitude. DueBadge's text already does exactly that ("Due soon — 6h 10m left"), which is why
      this screen needs no variant of the tag - only the absence of the grouping that would make
      the word redundant.
    */-->
    <!--/* T253 (spec 8f/9681e6d): <ul>/<li>, not <div> - fragments/case-card.html's root is
         <li role="listitem">, th:replace substitutes it for this placeholder tag entirely, so only
         the container needs changing here. role="list" is load-bearing, see app.css's own comment
         on .case-list for why. */-->
    <ul class="case-list" role="list">
        <!--/*
          The action decision is resolved in th:with rather than inline, because a link expression
          (@{...}) cannot be nested inside a ${...} - so the three destinations are built first and
          then chosen between. It also keeps one card call readable instead of four nested ternaries
          inside the fragment arguments.
        */-->
        <th:block th:each="r : ${requests}" th:with="
                report=${reports[r.id]},
                st=${r.status.name()},
                scheduleHref=@{/visitor/interviews/{id}/schedule(id=${r.id})},
                reportHref=@{/visitor/interviews/{id}/report(id=${r.id})},
                downloadHref=@{/reports/{id}/download(id=${r.id})},
                sentBack=${st == 'REPORT_REJECTED'}">
            <div th:replace="~{fragments/case-card :: caseCard(
                    identity=${childIdentities[r.child.id]},
                    href=@{/interview-requests/{id}(id=${r.id})},
                    meta=${r.home.name},
                    asideLabel='Visit',
                    aside=${r.scheduledAt != null
                            ? #temporals.format(r.scheduledAt, 'dd MMM yyyy, HH:mm')
                            : 'No time agreed yet'},
                    badge=${dueBadges[r.id]},
                    status=${r.status},
                    actionLabel=${st == 'ALLOCATED' ? 'Confirm visit time'
                            : (st == 'SCHEDULED' ? 'Submit report'
                            : (sentBack ? 'Amend and resubmit'
                            : (st == 'REPORT_APPROVED' ? 'Download' : null)))},
                    actionHref=${st == 'ALLOCATED' ? scheduleHref
                            : (st == 'REPORT_APPROVED' ? downloadHref : reportHref)},
                    noAction=${st == 'REPORT_SUBMITTED' ? 'Awaiting review — nothing for you to do' : null},
                    noteLabel=${sentBack ? 'Reviewer''s comment' : null},
                    note=${sentBack and report != null ? report.reviewComments : null})}"></div>
        </th:block>
    </ul>

    <!--/*
      R-Q13, both cases. Oscar added the second one for exactly this screen: a visitor who has
      finished everything allocated to them sees an empty list, and "your coordinator will assign
      them here" would read as a rebuke for work they have in fact done. The two states are
      different facts and get different words.
    */-->
    <div class="empty" th:if="${#lists.isEmpty(requests)}">
        No interviews have been allocated to you yet. Your coordinator will assign them here.
    </div>
    <div class="empty" th:if="${nothingOutstanding}">
        Nothing outstanding. Interviews you've completed stay on each child's record.
    </div>
</main>
</body>
</html>
