# Demo profile: a self-contained, fully-populated tenancy for showing the app to clients.
#
# This profile is opt-in and is never active by default. Activating it seeds fictional
# organisations, homes, children, users and interviews (see DemoDataSeeder) and enables
# well-known credentials, so it must only ever point at a throwaway database.
#
# Bring-up is documented in DEMO.md and is one command: ./scripts/demo-up.sh

# The demo gets its OWN database rather than sharing the local development one. Resetting a
# demo is a routine thing to want to do, and it must never be capable of taking a developer's
# working data with it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rht_demo}

# Both are well-known DEMO credentials, not secrets. The main profile deliberately has no
# default admin password (AdminUserSeeder fails safe); supplying one here is scoped to this
# file, which is only read when the demo profile is explicitly requested.
app.admin.username=${ADMIN_SEED_USERNAME:admin}
app.admin.password=${ADMIN_SEED_PASSWORD:demo1234}
app.demo.password=${DEMO_PASSWORD:demo1234}

# Demos are given live, in front of people, and a lockout mid-presentation from a mistyped
# password is worse than the protection is worth on invented data.
app.security.login-throttle.enabled=false

# Keep generated demo documents out of the working copy used for real report output. The demo's
# documents are encrypted like any other; this is just where that ciphertext lands.
app.documents.local.directory=${user.dir}/generated-reports/demo

logging.level.ninja.samryecroft.returnhome.tracker.demo=INFO
