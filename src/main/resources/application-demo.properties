# Demo profile: a self-contained, fully-populated tenancy for showing the app to clients.
#
# This profile is opt-in and is never active by default. Activating it seeds fictional
# organisations, homes, children, users and interviews (see DemoDataSeeder) and enables
# well-known credentials, so it must only ever point at a throwaway database.
#
# Bring-up is documented in DEMO.md and is one command: ./scripts/demo-up.sh

# The demo gets its OWN database rather than sharing the local development one. Resetting a
# demo is a routine thing to want to do, and it must never be capable of taking a developer's
# working data with it.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rht_demo}

# The same throwaway container credentials as application-dev.properties, for the same reason:
# they match docker-compose.yml, they are in the repository on purpose, and they are not secrets.
# Carrying them here is what makes ./scripts/demo-up.sh need no environment variables at all - the
# base file deliberately gives spring.datasource.password no fallback so a real deployment that
# forgets to inject DB_PASSWORD fails closed. Both still honour an override if one is exported.
spring.datasource.username=${DB_USERNAME:tracker}
spring.datasource.password=${DB_PASSWORD:tracker}

# Both are well-known DEMO credentials, not secrets. The main profile deliberately has no
# default admin password (AdminUserSeeder fails safe); supplying one here is scoped to this
# file, which is only read when the demo profile is explicitly requested.
#
# T312: these were "demo1234" - EIGHT characters, against a policy whose minimum is twelve. The
# policy tightened (T272) and the seed did not move with it, and the failure was PARTIAL rather
# than total, which is why nobody caught it: AdminUserSeeder checks the policy and so refused to
# create the admin at all, while DemoDataSeeder does not check and happily created everybody else.
# So a demo signed in fine as coordinator and could not get into admin - in front of a customer,
# following DEMO.md, which said the password worked.
#
# THESE VALUES ARE NOW GUARDED BY A TEST, not by anyone remembering. See
# TheDemoCredentialsStillSatisfyThePasswordPolicyTest: the next time the policy tightens, the build
# goes red rather than a demo does. Changing either value means changing DEMO.md too, which that
# test also checks - the credential is documented in three files and they must agree.
app.admin.username=${ADMIN_SEED_USERNAME:admin}
app.admin.password=${ADMIN_SEED_PASSWORD:demo-walkthrough}
app.demo.password=${DEMO_PASSWORD:demo-walkthrough}

# Demos are given live, in front of people, and a lockout mid-presentation from a mistyped
# password is worse than the protection is worth on invented data.
app.security.login-throttle.enabled=false

# Keep generated demo documents out of the working copy used for real report output. The demo's
# documents are encrypted like any other; this is just where that ciphertext lands.
app.documents.local.directory=${user.dir}/generated-reports/demo

logging.level.ninja.samryecroft.returnhome.tracker.demo=INFO
