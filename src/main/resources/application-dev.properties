# Local development only. Holds the throwaway-container credentials that used to live as inline
# fallbacks in application.properties - they are deliberately NOT in the base file so a
# misconfigured staging/prod deployment fails fast instead of starting on a default credential.
#
#   docker compose up -d
#   SPRING_PROFILES_ACTIVE=dev ./mvnw spring-boot:run
#
# These match docker-compose.yml and are not secrets. Never activate this profile outside a
# developer machine.
spring.datasource.url=jdbc:postgresql://localhost:5432/return_home_tracker
spring.datasource.username=tracker
spring.datasource.password=tracker
