# Deployment profile for WS-B: Azure Blob for the ciphertext, Key Vault (UK South) for the
# per-organisation KEKs. Activated alongside the environment's own profile, e.g.
# SPRING_PROFILES_ACTIVE=azure,prod.
#
# Nothing here is a secret. The application authenticates to both services as its managed identity
# via DefaultAzureCredential, so there is no storage account key or client secret to leak - which is
# also why app.documents.blob.connection-string is left unset: it exists only for Azurite locally.
app.documents.storage=azure-blob
app.documents.keys=key-vault

app.documents.blob.endpoint=${BLOB_ENDPOINT}
app.documents.blob.container=${BLOB_CONTAINER:report-documents}
# Containers come from Terraform (WS-D), not from the application.
app.documents.blob.create-container-if-missing=false

app.documents.key-vault.uri=${KEY_VAULT_URI}
# RSA-OAEP-256 because symmetric (oct) keys are a Managed HSM feature and Managed HSM was ruled out
# on cost. The KEK still never leaves the vault, which is the property that matters. The algorithm
# is recorded per document, so changing it here only affects documents written afterwards.
app.documents.key-vault.wrap-algorithm=${KEY_WRAP_ALGORITHM:RSA-OAEP-256}
# false, and deliberately so (confirmed with DevOps for WS-D). Wrap/unwrap live in the Key Vault
# Crypto User role; key create/delete live in Crypto Officer, and the two are disjoint - so lazy
# creation would force the request-path identity to hold Officer, i.e. delete and purge rights over
# the whole vault. The running app is Crypto User only. Creating org-{id}-kek is a privileged
# onboarding step performed by a separate operator identity when a CARE_PROVIDER organisation is
# added; if the key is missing, that organisation's first report failing closed is correct
# behaviour, not a bug. See DOCUMENT-KEYS.md.
app.documents.key-vault.auto-create-keys=${KEY_VAULT_AUTO_CREATE:false}
