name: CI

# Build + test only. Deliberately has NO Azure identity of any kind (WS-E-DESIGN 5.2): build and
# test run entirely locally (Testcontainers + Playwright), so nothing here needs a cloud token — and
# CI is the job most exposed to third-party code, so a credential that is never issued cannot be
# misused by a malicious dependency pulled in during `mvn verify`. Deploy auth lives only in
# deploy.yml, gated by GitHub Environments.

on:
  push:
    branches: [main]
  pull_request:

# Workflow-level: read only, and NO id-token. Each job re-declares its own least privilege (5.3).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + verify (required gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # All actions pinned to a commit SHA, not a moving tag (5.3) — the version is in the comment.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # T212: the Playwright suite runs HERE now. WebKit's Linux shared libraries are not on the
      # runner and Playwright downloads browsers but never the OS packages they link against, so
      # WebkitIconSmokeUiTest fails with "Host system is missing dependencies to run browsers:
      # libgtk-4.so.1" without this. Pinned to the same version as the Java binding in pom.xml so
      # the two cannot drift. If a test ever launches firefox, add it here - the failure looks
      # identical. (The quarantine lane below keeps its own copy: it must still work if a browser
      # test is ever quarantined again.)
      - name: Install WebKit's Linux system dependencies
        run: npx --yes playwright@1.60.0 install-deps webkit
      # T212: `-DexcludedGroups=flaky-infra` is KEPT even though nothing carries the tag today. It is
      # what makes quarantining possible at all, and removing it would mean a future quarantine
      # silently did nothing. QuarantineDisciplineGuardTest is what stops that option going stale.
      #
      # Until 2026-09-08 the entire browser-rendering evidence base sat outside this gate: every
      # *UiTest inherited @Tag("flaky-infra") from AbstractUiTest. Kevin's T212 ruling: a false red
      # is visible and self-correcting, silent non-coverage is invisible and self-perpetuating -
      # and T116 is the proof, where admin/user-list merged green while reading a removed field
      # because only a non-blocking Playwright test rendered it.
      - name: Build + verify (excluding any quarantined tests)
        run: ./mvnw -B -ntp verify -DexcludedGroups=flaky-infra
      # The deployable Spring Boot jar, handed to deploy.yml. *.jar excludes the *.jar.original thin jar.
      - name: Upload deployable jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  flaky-infra:
    name: flaky-infra quarantine (non-blocking)
    runs-on: ubuntu-latest
    # Runs the quarantined infra-timing tests (T21: contextLoads + the Playwright UI suite) so they
    # keep reporting a signal, but continue-on-error means a flake here NEVER fails the workflow and
    # so never blocks a merge. They are quarantined, not deleted — a real regression still shows red
    # on this lane for a human to notice.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # WebKit's Linux shared libraries, which the runner does not ship. Playwright downloads the
      # browser binaries itself (pom.xml, install-playwright-browsers) but never the OS packages
      # they link against, and every UI test launched chromium until T128 added an iOS-icon smoke
      # test on webkit - so only chromium's deps were ever present, and webkit failed with "Host
      # system is missing dependencies to run browsers: libgtk-4.so.1, libgraphene-1.0.so.0".
      # That made this lane permanently red, which is worse than one failing test: a quarantine
      # lane exists to surface intermittent flakes, and a lane that is always red surfaces nothing.
      #
      # Pinned to the same version as the Java binding in pom.xml so the two cannot drift apart.
      # If a test ever launches firefox, add it to this line - the failure will look identical.
      - name: Install WebKit's Linux system dependencies
        run: npx --yes playwright@1.60.0 install-deps webkit
      # T212: NOTHING carries this tag today, and -DfailIfNoSpecifiedTests=false is what keeps an
      # empty quarantine GREEN rather than permanently red on "No tests were executed!". A lane that
      # is always red surfaces nothing - the same argument this file already makes about the WebKit
      # dependencies above. The lane is kept, empty, so that quarantining stays a low-friction
      # option: make it hard and the next person under time pressure deletes the test instead.
      - name: Run only quarantined tests (reported, not required)
        run: ./mvnw -B -ntp verify -Dgroups=flaky-infra -DfailIfNoSpecifiedTests=false

  actionlint:
    name: actionlint (workflow lint)
    runs-on: ubuntu-latest
    # These workflows mint cloud credentials; the properties we rely on (job-level id-token,
    # environment: on the credentialed jobs) are exactly what a later edit loosens by accident.
    # actionlint catches malformed permissions blocks + expression-injection patterns, runs in
    # seconds, needs no credentials — so it lives here in ci.yml (which has no Azure identity), not
    # in deploy.yml (Kevin T89). shellcheck is bundled in the actionlint image, so run: blocks are
    # linted too.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run actionlint
        run: docker run --rm -v "${PWD}:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  terraform:
    name: terraform fmt + validate (required gate)
    runs-on: ubuntu-latest
    # Until now `terraform validate` ran ONLY inside deploy.yml, which is dispatch-only and has never
    # completed a run - so a malformed .tf merged green and would first surface mid-apply, against the
    # live estate. This gate moves that check to the place it belongs.
    #
    # NO Azure identity, consistent with the rest of this file: `init -backend=false` is exactly the
    # path backend.tf documents for validating without a state account or cloud auth, so this needs no
    # token and cannot touch state. It validates the ROOT module; the modules are validated with it as
    # part of the root's configuration.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.5.7 # keep in step with TF_VERSION in deploy.yml
      # -recursive so the modules/ tree is covered too. fmt drift is cosmetic on its own, but an
      # unformatted file makes every later diff noisier than the change it contains.
      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: terraform validate
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

  dependency-scan:
    name: dependency vulnerability scan (reported, not yet required)
    runs-on: ubuntu-latest
    # This application holds Article 9 data about children and its dependency tree was entirely
    # unscanned: pom.xml carries no security plugins, and CI checked nothing. OSV-Scanner needs no API
    # key and no credentials (unlike OWASP dependency-check, which now wants an NVD key), so it fits
    # this file's "CI holds no identity" rule. Pinned by version, and run through docker exactly like
    # the actionlint job above.
    #
    # NON-BLOCKING, ON PURPOSE, AND THIS IS TIME-BOUNDED. First run (2026-09-18) reports 27 known
    # vulnerabilities across 14 packages, 5 of them Critical - including tomcat-embed-core 11.0.22
    # (CVSS 9.8) and netty-handler / azure-security-keyvault-keys (9.1). Nearly all of them are
    # TRANSITIVE and version-managed by spring-boot-starter-parent 4.1.0, so they are not fixable by
    # pinning individual dependencies here: they need a Spring Boot patch bump, which is its own change
    # with its own test run. Making this blocking first would have stopped every merge on a backlog
    # that predates the gate.
    #
    # This file already argues the other side of exactly this trade-off ("silent non-coverage is
    # invisible and self-perpetuating", T212), and that argument applies here too - which is why the
    # baseline is written down above rather than left for someone to rediscover. FLIP continue-on-error
    # TO false once the Spring Boot bump lands and the count is 0. A permanently non-blocking scanner
    # is a scanner nobody reads.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run OSV-Scanner over the Maven tree
        run: |
          docker run --rm -v "${PWD}:/repo" -w /repo \
            ghcr.io/google/osv-scanner:v2.6.0 scan source --lockfile=pom.xml
