name: Deploy

# WS-E deploy pipeline. Execution is SPLIT (design fork 2c): the control plane (terraform, Key Vault
# writes, App Service deploy, smoke, rollback) runs on hosted runners over public ARM endpoints; only
# the DB-plane migration runs VNet-side, in a PER-RUN EPHEMERAL Container Apps job created and torn
# down by deploy/db-plane/ephemeral-migrate.sh (T180). No standing credentialed host inside the VNet,
# and no standing Container Apps environment either - the old migrator_job module is gated off
# (enable_migrator_job=false) precisely because its idle internal load balancer cost ~£6.5/mo.
#
# Identity: two user-assigned managed identities via OIDC, gated by GitHub Environments so protection
# rules are evaluated BEFORE a token is minted (environment: subjects, not ref:/pull_request):
#   - plan job -> rht-ci-plan   (environment 'plan', branch-restricted)
#   - deploy   -> rht-cd-prod   (environment 'prod', required reviewers, main only)
# Both created out of band by bootstrap-deployer-identity.sh; client ids + config come from the
# Environment vars/secrets that script + PREFLIGHT set up.

# STILL DISPATCH-ONLY, but for a narrower reason than before. The push-to-main trigger stays commented
# out until this pipeline has actually completed several green runs on demand. What has changed:
#
#   - The T100 ordering deadlock in bootstrap-deployer-identity.sh is GONE. It existed because the
#     script's KV/ACR grants needed resources that only the first apply creates; those resources now
#     exist (the estate was deployed manually), so the script's EDIT THESE block is simply filled in.
#   - The DB-plane steps have been REWRITTEN to the ephemeral path. They previously read
#     `terraform output -raw container_app_job_name`, which is null since T355 - so the apply step would
#     have failed AFTER changing the estate. That trap is removed.
#   - TF_VAR_budget_alert_email is now passed. It is a required variable with no default, so with
#     -input=false the plan job aborted on "No value for required variable" before this fix.
#
# What must be true BEFORE uncommenting `push:` below:
#   1. Both OIDC identities exist WITH federated credentials (rht-cd-prod had none - no FIC, no token).
#   2. The 'plan' and 'prod' Environments exist, prod has >=1 required reviewer, plan is main-only.
#   3. All Environment vars/secrets are set: PLAN_CLIENT_ID, CD_CLIENT_ID, AZURE_TENANT_ID,
#      AZURE_SUBSCRIPTION_ID, TF_STATE_*, ALERT_EMAIL, BUDGET_ALERT_EMAIL, and
#      TF_VAR_POSTGRES_ADMINISTRATOR_PASSWORD - which must match the value the live server already
#      has, or the apply resets it. The other three password secrets are no longer read by
#      terraform at all (the Key Vault secret resources they fed are gone); their values are
#      managed out of band.
#   4. The rollback path has been exercised deliberately at least once. It is wired now (B1
#      redeploy-previous), and a rollback nobody has tested is not a rollback.
# Until then the pipeline runs ONLY on demand via workflow_dispatch. This does not fake success and
# does not delete anything - it stops the workflow firing before the things it needs are real.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]   # <- re-enable ONLY after the OIDC identities + Environments + secrets exist.

# Minimal at workflow level; each job re-declares its own (5.3). NO id-token here.
permissions:
  contents: read

# Never cancel an in-flight production deploy.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  TF_DIR: terraform
  TF_VERSION: 1.5.7
  # App Insights Java agent, PINNED + checksum-verified (supply chain). The 46MB agent jar is NOT
  # committed; it is fetched from Maven Central at deploy time and staged next to the app jar. Bump
  # both together (get the sha256 from <mavenurl>/applicationinsights-agent-<ver>.jar.sha256). The
  # JVM attaches it via JAVA_OPTS=-javaagent:.../applicationinsights-agent.jar, which is set in the
  # Terraform app_service module (the durable source of truth for the setting; the version lives here).
  # The two STATIC App Insights files are written with a plain Kudu VFS PUT, NOT `az webapp deploy`.
  #
  # Why, with the platform's own records. `az webapp deploy --type static --restart false` failed three
  # runs in a row at the same step, and the push was never the problem: Kudu logged every one of them
  # "Deployment successful" within ~5s (e.g. DeploymentId f0a13081, 15:45:12 -> 15:45:17). What failed
  # was the CLI's post-push wait for the SITE TO START - it sat at "Starting the site..." from t=31s
  # with no state change for 570s, then reported "failed to start within 10 mins / FailedInstances: 1",
  # while readiness stayed 200 the whole time. With --restart false no start ever begins, so that wait
  # can only ever time out. Neither --timeout (governs the CLI's polling, not this server-side limit)
  # nor --async (this CLI version polls the deployment status anyway) changes that.
  #
  # A VFS PUT is a file write: no deployment orchestration, no start expectation. It is the same
  # endpoint and the same ARM bearer token the verify step below already uses to read the files back,
  # so this adds no new auth path. "If-Match: *" is what lets it overwrite an existing file (Kudu's VFS
  # is ETag-guarded and returns 412 otherwise).
  #
  # The JAR deploy stays on `az webapp deploy` and stays synchronous: it DOES restart the app, and the
  # wait is then a real signal. Measured today from the platform log: container start 10:21:50 ->
  # WarmUpProbeSucceeded 10:29:10 = 440s, inside the platform's ~570s window with ~130s to spare. Tight
  # but real; if boot creeps past it, that step needs the same treatment (Kudu's OneDeploy REST API with
  # async=true, then the smoke step owns readiness).
  AI_AGENT_VERSION: "3.7.9"
  AI_AGENT_SHA256: "4ab7a442bf9defc7475d026c6b49042793ebb010c391a1db91ae07da0c04d848"

jobs:
  plan:
    name: terraform plan
    runs-on: ubuntu-latest
    environment: plan
    permissions:
      contents: read
      id-token: write # OIDC to Azure - job level only
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Azure login (rht-ci-plan, OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      # NOTE (Kevin 5.4): the plan tier is NOT low-privilege - state holds all four DB passwords in
      # clear, so anyone who can run this can read them. Fenced by the 'plan' environment's branch
      # restriction until 5.4 (generate secrets VNet-side, keep them out of state) lands.
      - name: Terraform init + plan
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_USE_OIDC: "true"
          # azure/login authenticates the az CLI; it does NOT configure the azurerm PROVIDER, which
          # reads its own ARM_* variables. With only ARM_USE_OIDC set, terraform fails at init with
          # "a Tenant ID must be configured when authenticating with OIDC / a Client ID must be
          # configured" - which is exactly what the first real run of this workflow did. The OIDC
          # request url/token are picked up from the ACTIONS_ID_TOKEN_REQUEST_* variables the runner
          # exports because this job has id-token: write, so only the identity triple is needed.
          # ARM_SUBSCRIPTION_ID is set alongside TF_VAR_subscription_id: the provider takes the
          # subscription from the variable, but the azurerm BACKEND reads the ARM_ one.
          ARM_CLIENT_ID: ${{ vars.PLAN_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
          # The ONLY password terraform still takes: the Postgres server resource requires it. The other
          # three (admin seed, migrator, runtime) existed solely to write Key Vault secrets and were
          # removed with those resources - their values are managed out of band now, so passing them here
          # would put a live credential in a runner's environment for nothing. Their repo secrets can be
          # deleted once nothing else reads them.
          TF_VAR_postgres_administrator_password: ${{ secrets.TF_VAR_POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=reg-tracker.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform plan -input=false -out=tfplan
      - name: Upload plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: apply + migrate + deploy
    runs-on: ubuntu-latest
    needs: plan
    if: github.ref == 'refs/heads/main'
    environment: prod # required reviewers - every prod deploy waits for a human
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Azure login (rht-cd-prod, OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # --- Control plane: terraform apply (creates/updates infra + writes KV secrets) ---
      - name: Terraform init + apply
        id: tf
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_USE_OIDC: "true"
          # azure/login authenticates the az CLI; it does NOT configure the azurerm PROVIDER, which
          # reads its own ARM_* variables. With only ARM_USE_OIDC set, terraform fails at init with
          # "a Tenant ID must be configured when authenticating with OIDC / a Client ID must be
          # configured" - which is exactly what the first real run of this workflow did. The OIDC
          # request url/token are picked up from the ACTIONS_ID_TOKEN_REQUEST_* variables the runner
          # exports because this job has id-token: write, so only the identity triple is needed.
          # ARM_SUBSCRIPTION_ID is set alongside TF_VAR_subscription_id: the provider takes the
          # subscription from the variable, but the azurerm BACKEND reads the ARM_ one.
          ARM_CLIENT_ID: ${{ vars.CD_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
          TF_VAR_budget_alert_email: ${{ vars.BUDGET_ALERT_EMAIL }}
          # The ONLY password terraform still takes: the Postgres server resource requires it. The other
          # three (admin seed, migrator, runtime) existed solely to write Key Vault secrets and were
          # removed with those resources - their values are managed out of band now, so passing them here
          # would put a live credential in a runner's environment for nothing. Their repo secrets can be
          # deleted once nothing else reads them.
          TF_VAR_postgres_administrator_password: ${{ secrets.TF_VAR_POSTGRES_ADMINISTRATOR_PASSWORD }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_SA }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=reg-tracker.tfstate" \
            -backend-config="use_azuread_auth=true"
          terraform apply -input=false -auto-approve
          # NB: container_app_job_name is deliberately NOT read here. Since T355 the standing migrator
          # job is gated off (enable_migrator_job=false), so that output is null, and `output -raw` on a
          # null value EXITS NON-ZERO - which would fail this step AFTER apply had already changed the
          # estate, the worst possible place to fail. The migration path is the per-run ephemeral env
          # below, which names its own job, so nothing needs that output.
          {
            echo "rg=$(terraform output -raw resource_group_name)"
            echo "app_name=$(terraform output -raw app_service_name)"
            echo "acr=$(terraform output -raw container_registry_login_server)"
            # Inputs for the ephemeral DB-migration env (see deploy/db-plane/ephemeral-migrate.sh).
            echo "name_prefix=$(terraform output -raw name_prefix)"
            echo "location=$(terraform output -raw location)"
            echo "migrate_subnet_id=$(terraform output -raw migrate_subnet_id)"
            echo "log_ws_id=$(terraform output -raw log_analytics_workspace_customer_id)"
            echo "key_vault_uri=$(terraform output -raw key_vault_uri)"
            echo "db_host=$(terraform output -raw postgres_fqdn)"
            echo "db_name=$(terraform output -raw database_name)"
            echo "admin_login=$(terraform output -raw postgres_administrator_login)"
            echo "migrator_login=$(terraform output -raw migrator_db_login)"
            echo "cd_identity_name=$(terraform output -raw cd_identity_name)"
          } >> "$GITHUB_OUTPUT"

      # --- 5.1: assert the app is pinned to an allowed profile and NEVER 'demo' (fail closed). ---
      # The allowlist is the EXPLICIT single value {azure}. It was {azure, "azure,entra"} while the
      # Entra sign-in cutover was planned; Entra has been removed, so the second member is gone with
      # it rather than left as a permanently-unreachable widening. The history is recorded here on
      # purpose: it is what stops the set being widened back to a value nothing can now produce.
      # It is deliberately NOT a prefix/substring match - this is the pipeline half of the two-layer
      # demo guard (DemoProfileGuard is the in-app half), so the 'demo' refusal below must survive
      # any widening. There is no 'prod' profile.
      - name: Assert SPRING_PROFILES_ACTIVE
        run: |
          profiles="$(az webapp config appsettings list \
            -g '${{ steps.tf.outputs.rg }}' -n '${{ steps.tf.outputs.app_name }}' \
            --query "[?name=='SPRING_PROFILES_ACTIVE'].value | [0]" -o tsv)"
          echo "SPRING_PROFILES_ACTIVE=${profiles}"
          case ",${profiles}," in
            *,demo,*) echo "FATAL: 'demo' profile present on a real deployment - refusing." >&2; exit 1 ;;
          esac
          case "${profiles}" in
            azure) ;;  # explicit allowlist - keep exact, not a prefix match
            *)
              echo "FATAL: SPRING_PROFILES_ACTIVE='${profiles}', expected 'azure' (allowlist)." >&2
              exit 1
              ;;
          esac

      # --- DB-plane image: build the custom flyway+psql+jq image with the migration payload baked in
      # (deploy/db-plane/Dockerfile) and push it to ACR, capturing the DIGEST. The CD identity has
      # AcrPush (out-of-band bootstrap). No registry credential: az acr login uses the OIDC session.
      # The DIGEST - never the tag - is what the migration job below runs, so the image this run built
      # is provably the image that touches the database.
      - name: Build + push DB-plane image
        id: dbimage
        run: |
          acr='${{ steps.tf.outputs.acr }}'                 # e.g. crrht<sfx>.azurecr.io
          tag="${GITHUB_SHA}"
          az acr login --name "${acr%%.*}"
          docker build -f deploy/db-plane/Dockerfile -t "${acr}/rht-db-plane:${tag}" .
          docker push "${acr}/rht-db-plane:${tag}"
          digest="$(az acr repository show --name "${acr%%.*}" \
            --image "rht-db-plane:${tag}" --query digest -o tsv)"
          echo "image=rht-db-plane@${digest}" >> "$GITHUB_OUTPUT"
          echo "pushed ${acr}/rht-db-plane@${digest}"

      # --- DB plane: run 01 SQL -> Flyway -> 02 SQL VNet-side, BEFORE the new jar goes live ---
      # (expand/contract migrations keep the running jar valid, so redeploy-previous rollback stays safe).
      #
      # T180 EPHEMERAL PATH. This replaces the old `az containerapp job start` against a STANDING job,
      # which could never have worked here: T355 gated that job off (enable_migrator_job=false), so its
      # name output is null. deploy/db-plane/ephemeral-migrate.sh creates a per-run env in the dedicated
      # migrate subnet, runs the digest-pinned job, and ALWAYS tears the env down again - verified, via a
      # trap on every exit path - so its internal load balancer lives for the minutes of a migration
      # instead of idling 24/7 (the ~£6.5/mo T180 removed).
      #
      # Kevin T89 preserved: the job runs with the CD user-assigned identity IN the VNet and reads the DB
      # passwords from Key Vault itself. No DB credential is passed in from this runner - the four
      # TF_VAR_* password secrets are used by terraform only, and are not in this step's environment.
      #
      # LOG_WS_KEY is fetched here rather than carried through a Terraform output. It is the workspace's
      # log-INGESTION shared key - rotatable, ingestion-scoped, and NOT a DB/Key Vault/application
      # credential; the exception is argued in the script's header (Kevin F1). It is masked so it cannot
      # surface in the run log even if a later command echoes its environment.
      - name: Run DB-plane migration (ephemeral env, VNet-side) and wait for success
        env:
          RG: ${{ steps.tf.outputs.rg }}
          NAME_PREFIX: ${{ steps.tf.outputs.name_prefix }}
          LOCATION: ${{ steps.tf.outputs.location }}
          MIGRATE_SUBNET_ID: ${{ steps.tf.outputs.migrate_subnet_id }}
          LOG_WS_ID: ${{ steps.tf.outputs.log_ws_id }}
          ACR_LOGIN_SERVER: ${{ steps.tf.outputs.acr }}
          DB_PLANE_IMAGE: ${{ steps.dbimage.outputs.image }}
          CD_CLIENT_ID: ${{ vars.CD_CLIENT_ID }}
          KEY_VAULT_URI: ${{ steps.tf.outputs.key_vault_uri }}
          DB_HOST: ${{ steps.tf.outputs.db_host }}
          DB_NAME: ${{ steps.tf.outputs.db_name }}
          ADMIN_LOGIN: ${{ steps.tf.outputs.admin_login }}
          MIGRATOR_LOGIN: ${{ steps.tf.outputs.migrator_login }}
          CD_IDENTITY_NAME: ${{ steps.tf.outputs.cd_identity_name }}
        run: |
          # The CD identity is created out of band (bootstrap-deployer-identity.sh), so its resource id
          # is not a Terraform output - resolve it from the name, which is.
          CD_IDENTITY_ID="$(az identity show -g "$RG" -n "$CD_IDENTITY_NAME" --query id -o tsv)"
          export CD_IDENTITY_ID

          LOG_WS_KEY="$(az monitor log-analytics workspace get-shared-keys \
            -g "$RG" -n "log-${NAME_PREFIX}" --query primarySharedKey -o tsv)"
          echo "::add-mask::${LOG_WS_KEY}"
          export LOG_WS_KEY

          # The script owns its own budgets and teardown; it exits 0 / 1 / 3 and we must distinguish all
          # three (a bare `set -e` would collapse 1 and 3 into "failed" and throw away the one case where
          # the migration DID apply).
          set +e
          bash deploy/db-plane/ephemeral-migrate.sh
          rc=$?
          set -e
          case "$rc" in
            0)
              echo "DB-plane migration succeeded; ephemeral env teardown CONFIRMED."
              ;;
            3)
              # Migration applied, but teardown could not be CONFIRMED (distinct from "failed to delete"
              # - an ARM throttle or token failure reads the same from outside). Deploying is correct: the
              # schema is migrated and the jar must follow it. But a stranded internal load balancer is
              # exactly the invisible cost T180 removed, so this must not pass silently.
              echo "::warning title=Ephemeral migration env teardown unconfirmed::Migration SUCCEEDED and the deploy continues, but teardown of cae-${NAME_PREFIX}-migrate was not confirmed. CHECK for a leftover platform-managed ME_cae-${NAME_PREFIX}-migrate_${RG}_* resource group and delete any stranded internal load balancer."
              ;;
            *)
              echo "::error title=DB-plane migration failed::Aborting BEFORE the jar deploy so the running jar keeps a schema it is valid against (WS-G ordering: 01 -> Flyway -> 02 -> jar). The script captured the failed execution's console logs above, or printed a retrieval recipe against the standing Log Analytics workspace."
              exit 1
              ;;
          esac

      # --- Deploy the jar. TARGET DESIGN = staging-slot deploy + swap (zero-downtime, instant ---
      # rollback-by-swap). Slots need App Service STANDARD+ (S1); WS-D provisions B1 (Basic) which has
      # NO slots. Until the S1 tier decision (a T83 cost item) lands, this uses the B1-compatible
      # DIRECT deploy below; rollback is redeploy-previous-artifact. Swap in the slot flow once on S1.
      - name: Build deployable jar (tests already gated by CI)
        run: ./mvnw -B -ntp -DskipTests package

      # --- Stage the App Insights Java agent + its config NEXT TO the jar, BEFORE the jar deploy so the
      # files are present when the container boots with -javaagent. The agent attaches via
      # JAVA_OPTS=-javaagent:/home/site/wwwroot/applicationinsights-agent.jar, set in Terraform's
      # app_service module (durable source of truth). The 46MB agent jar is NOT committed: it is fetched
      # at the PINNED AI_AGENT_VERSION and checksum-verified (supply chain), then staged together with
      # applicationinsights.json (deploy/appservice/ - Kevin's ruling: a filesystem file the agent reads
      # via APPLICATIONINSIGHTS_CONFIGURATION_FILE, never baked into the classpath). --clean false so
      # neither this step nor the jar deploy below wipes the other's files.
      # --- Fresh OIDC exchange before the first Kudu call. The GitHub OIDC token that azure/login
      # exchanges is valid for FIVE MINUTES. Every step above reuses the ARM access token cached at the
      # job's first login (good for ~1h), but the Kudu VFS steps below call
      # `az account get-access-token --resource https://management.azure.com`, and that audience string
      # differs from the cached one - so the CLI MINTS a new token, which needs a live assertion. On the
      # fourth run of this workflow the migration step had pushed the job 26 minutes past login, and that
      # first mint died with "AADSTS700024: Client assertion is not within its valid time range
      # (valid 17:00:30 -> 17:05:30, current 17:31:08)" before a single byte was pushed.
      #
      # Logging in again here re-mints the assertion. The management.azure.com token acquired by the very
      # next step is then cached for ~1h and reused by the snapshot and verify steps without a fresh
      # assertion, so ONE re-login covers everything that follows. Same action, same pin, same identity.
      - name: Azure login again (assertion refresh before Kudu VFS steps)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.CD_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Stage App Insights agent + config
        run: |
          agent="applicationinsights-agent-${AI_AGENT_VERSION}.jar"
          url="https://repo1.maven.org/maven2/com/microsoft/azure/applicationinsights-agent/${AI_AGENT_VERSION}/${agent}"
          curl -fsSL -o "$agent" "$url"
          echo "${AI_AGENT_SHA256}  ${agent}" | sha256sum -c -
          # Plain file writes via Kudu VFS (see the DEPLOY comment at the top of this file for why this is
          # not `az webapp deploy`). Same token + endpoint as the verify step below. PUT returns 201 on
          # create, 204 on overwrite; anything else is a failure worth stopping for.
          app='${{ steps.tf.outputs.app_name }}'
          token="$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)"
          put_file() { # $1 = local path, $2 = wwwroot target name
            code="$(curl -s -o /dev/null -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${token}" -H "If-Match: *" \
              --data-binary "@$1" \
              "https://${app}.scm.azurewebsites.net/api/vfs/site/wwwroot/$2")"
            echo "PUT $2: HTTP ${code}"
            case "${code}" in 201|204) ;; *) echo "FATAL: Kudu VFS PUT of $2 returned HTTP ${code}" >&2; exit 1 ;; esac
          }
          put_file "$agent" applicationinsights-agent.jar
          put_file deploy/appservice/applicationinsights.json applicationinsights.json

      # --- Rollback source (T269 Phase 2, B1). B1 has NO deployment slots, so there is nothing to swap
      # back to: the only previous known-good artifact is the jar currently running. Snapshot it BEFORE
      # it is overwritten. Kudu VFS with the CD identity's ARM token - the same mechanism the verify step
      # below already uses, so this adds no new auth path and no publish profile.
      #
      # Deliberately NOT a cross-run artifact download: that would depend on the previous run's retention
      # and on the artifact matching what is actually deployed, which drifts the moment anyone deploys by
      # hand (and go-live WAS a manual deploy). Reading the live filesystem cannot drift - what it copies
      # is by definition what is serving traffic right now.
      #
      # NEVER fails the deploy: a missing snapshot is recorded as available=false and surfaces at rollback
      # time, because refusing to deploy over an un-snapshottable app would be a worse failure than
      # deploying without a net.
      - name: Snapshot the currently-live jar (rollback source)
        id: snapshot
        run: |
          app='${{ steps.tf.outputs.app_name }}'
          token="$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)"
          mkdir -p rollback
          code="$(curl -s -o rollback/app.jar -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://${app}.scm.azurewebsites.net/api/vfs/site/wwwroot/app.jar" || echo 000)"
          if [ "${code}" = "200" ] && [ -s rollback/app.jar ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "snapshotted the live jar for rollback ($(wc -c < rollback/app.jar) bytes)"
          else
            rm -f rollback/app.jar
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No rollback snapshot::Could not read the live app.jar (HTTP ${code}). Expected on the FIRST automated deploy. This deploy proceeds with NO rollback artifact - if it fails, recovery is manual."
          fi

      - name: Deploy jar to App Service (B1 direct deploy)
        run: |
          # The *.jar glob matches only the repackaged boot jar (the thin jar is *.jar.original).
          # --clean false: keep the App Insights agent jar + config staged in the step above.
          set -- target/*.jar
          jar="$1"
          # Deliberately synchronous, unlike the static files above: this one RESTARTS the app, its
          # measured ~440s boot fits inside the platform's ~570s window, and the wait is a real signal
          # that the NEW worker started. Returning early here would let the smoke step below pass
          # against the OLD process still serving traffic.
          az webapp deploy --type jar --clean false \
            -g '${{ steps.tf.outputs.rg }}' -n '${{ steps.tf.outputs.app_name }}' --src-path "$jar"

      # --- Fail LOUDLY if either agent artifact is missing after deploy (Kevin/README). A missing jar
      # crash-loops the JVM (JAVA_OPTS points at it, so smoke would also fail); a missing
      # applicationinsights.json is worse-because-silent: the agent falls back to defaults, quietly
      # dropping the 100% sampling + role name and degrading R5 detection. Kudu VFS returns 200 iff the
      # file exists; auth is the CD identity's ARM token (no publish profile).
      - name: Verify App Insights agent + config are staged
        run: |
          app='${{ steps.tf.outputs.app_name }}'
          token="$(az account get-access-token --resource https://management.azure.com --query accessToken -o tsv)"
          for f in applicationinsights-agent.jar applicationinsights.json; do
            code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
              "https://${app}.scm.azurewebsites.net/api/vfs/site/wwwroot/${f}")"
            echo "${f}: HTTP ${code}"
            if [ "${code}" != "200" ]; then
              echo "FATAL: ${f} is not present in /home/site/wwwroot after deploy (agent would not attach / config silently lost)." >&2
              exit 1
            fi
          done
      # On S1, replace the two steps above with:
      #   az webapp deploy ... --slot staging
      #   (smoke the staging slot)
      #   az webapp deployment slot swap -g <rg> -n <app> --slot staging --target-slot production
      #   rollback: az webapp deployment slot swap ... (swap back)

      # --- Smoke: readiness must be green, but not-green counts as FAILURE only AFTER the app's known
      # cold-start warmup window (T307). This app cold-boots in ~330-490s (measured, T190/T294): the old
      # 30 x 10s = 300s loop CANNOT pass a healthy deploy - it would report failure on every good release
      # and trip the rollback below, and it has not bitten only because that rollback is still a stub.
      # Budget is 900s, comfortably above the observed ~490s max with headroom, on a 15s interval. The
      # loop NEVER reports failure before the whole budget is spent, so the rollback step (if: failure())
      # cannot fire inside the warmup - which is the property T307 exists to guarantee. Revisit the budget
      # when a staging slot makes readiness observable before swap (T269/tier decision) or T294 makes the
      # boot fast; a slot would let this assert against the slot, not production, and the budget could drop.
      - name: Smoke test /actuator/health/readiness (warmup-aware)
        env:
          SMOKE_BUDGET_SECONDS: "900"    # > observed max cold boot (~490s) + headroom; see T307/T190
          SMOKE_INTERVAL_SECONDS: "15"
        run: |
          host="$(az webapp show -g '${{ steps.tf.outputs.rg }}' -n '${{ steps.tf.outputs.app_name }}' \
            --query defaultHostName -o tsv)"
          deadline=$(( $(date +%s) + SMOKE_BUDGET_SECONDS ))
          attempt=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://${host}/actuator/health/readiness" || true)"
            [ "$code" = "200" ] && { echo "readiness OK after ${attempt} attempt(s)"; exit 0; }
            remaining=$(( deadline - $(date +%s) ))
            echo "attempt ${attempt}: HTTP ${code} (still within ${SMOKE_BUDGET_SECONDS}s warmup budget, ~${remaining}s left), retrying..."
            sleep "$SMOKE_INTERVAL_SECONDS"
          done
          echo "FATAL: readiness never returned 200 within ${SMOKE_BUDGET_SECONDS}s - i.e. PAST the known warmup window, so this is a real failure." >&2
          exit 1
      # --- Rollback on failure (T269 Phase 2, wired for B1). By construction this runs ONLY if the smoke
      # step exhausted its full SMOKE_BUDGET_SECONDS (readiness still not 200 past the warmup window), so
      # it cannot fire during a normal cold start - that property is what makes an automatic redeploy safe
      # to arm at all.
      #
      # B1 rollback is redeploy-previous-artifact, not slot swap: Basic has no slots. So this is NOT
      # zero-downtime and NOT instant - it costs another full cold boot (~330-490s measured), during which
      # the service is down. That is the accepted cost of the B1 tier decision; S1 + slot swap is the
      # documented upgrade path (see the commented swap flow above).
      #
      # The step ALWAYS ends non-zero. The deploy failed; restoring the previous jar makes the outage
      # shorter, it does not make the run successful, and a green tick here would hide a failed release.
      - name: Rollback on failure
        if: failure()
        env:
          ROLLBACK_BUDGET_SECONDS: "900" # same warmup reasoning as the smoke step - a cold boot either way
          ROLLBACK_INTERVAL_SECONDS: "15"
        run: |
          echo "Deploy/smoke failed AFTER the ${SMOKE_BUDGET_SECONDS:-900}s warmup budget (a real failure, not warmup)."
          if [ '${{ steps.snapshot.outputs.available }}' != 'true' ] || [ ! -s rollback/app.jar ]; then
            echo "::error title=Cannot roll back::No previous jar was snapshotted (expected only on the FIRST automated deploy, or if Kudu was unreachable before the deploy). The app is left running whatever this run deployed. Recover by hand: redeploy the last known-good jar with 'az webapp deploy --type jar --clean false'."
            exit 1
          fi
          rg='${{ steps.tf.outputs.rg }}'; app='${{ steps.tf.outputs.app_name }}'
          echo ">> redeploying the previous jar ($(wc -c < rollback/app.jar) bytes) - expect a full cold boot"
          # --clean false: leave the App Insights agent + config staged alongside. Note the agent staged
          # earlier in THIS run stays in place; it is version-pinned and backwards compatible, and a
          # partial rollback of the agent would be a second variable during an incident.
          # Synchronous, same reasoning as the forward deploy: we must know the restored worker
          # actually started before judging whether the rollback recovered anything.
          az webapp deploy --type jar --clean false -g "$rg" -n "$app" --src-path rollback/app.jar
          host="$(az webapp show -g "$rg" -n "$app" --query defaultHostName -o tsv)"
          deadline=$(( $(date +%s) + ROLLBACK_BUDGET_SECONDS ))
          recovered=0
          while [ "$(date +%s)" -lt "$deadline" ]; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://${host}/actuator/health/readiness" || true)"
            if [ "$code" = "200" ]; then recovered=1; break; fi
            echo "rollback readiness: HTTP ${code} (~$(( deadline - $(date +%s) ))s of budget left)"
            sleep "$ROLLBACK_INTERVAL_SECONDS"
          done
          if [ "$recovered" = "1" ]; then
            echo "::warning title=Rolled back to the previous jar::The failed release was reverted and readiness is green again. The RUN still fails on purpose - the release did not ship. Investigate before retrying."
          else
            echo "::error title=Rollback did not recover::The previous jar was redeployed but readiness never returned 200 within ${ROLLBACK_BUDGET_SECONDS}s. The service is DOWN and needs a human now - check App Insights and the /actuator/health/readiness detail, and consider a PITR restore if the DB migration is implicated."
          fi
          exit 1
